name: 'celostar-starrocks build dev env image'

# **What it does**: Renders the content of every page and check all internal links.
# **Why we have it**: To make sure all links connect correctly.
# **Who does it impact**: Docs content.

on:
  workflow_dispatch:

permissions:
  contents: read
  # Needed for the 'trilom/file-changes-action' action
  pull-requests: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

jobs:
  release-ubuntu-image:
    runs-on: [self-hosted, celostar]
    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: GitHub Docker login
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${{ github.repository }} --password-stdin

      - name: build ubuntu docker image
        run: |
          # Get the default branch
          git fetch
          default_branch=$(git remote show origin | grep 'HEAD branch' | sed 's/^[[:space:]]*HEAD branch: //')
          echo "The default branch is ${default_branch}"
          git checkout $default_branch
          # Use the default branch name as the release version.
          echo "release_version=${default_branch}" >> $GITHUB_ENV
          # Build image and always remove intermediate containers.
          DOCKER_BUILDKIT=1 docker build --force-rm=true -f docker/dockerfiles/dev-env/dev-env.Dockerfile -t ghcr.io/celonis/celostar/starrocks-dev-env:${default_branch} .

      - name: push ubuntu docker image to GHCR
        run: |
          # Pushing to the GitHub packages docker registry regularly fails with "unknown blob" errors. The "fix" suggested by GitHub is looping.
          until docker push ghcr.io/celonis/celostar/starrocks-dev-env:${{ env.release_version }}
          do
            echo "Could not push ghcr.io/celonis/celostar/starrocks-dev-env:${{ env.release_version }} trying again."
          done

      - name: Clean up and GitHub Docker logout
        if: ${{ always() }}
        run: |
          docker logout ghcr.io
          docker rmi -f $(docker images -q ghcr.io/celonis/celostar/starrocks-dev-env:${{ env.release_version }})
          # Delete stopped containers, dangling images, dangling build cache, etc.
          docker system prune -f
        continue-on-error: true