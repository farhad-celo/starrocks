name: Build artifact image

inputs:
  dev_env_image:
    required: true
  image_tag:
    required: true
  is_asan_mode:
    description: "Whether to build in ASAN mode"
    required: false
  branch:
    required: false
  to_push:
    description: "Whether to push the artifact to GHCR"
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Pull dev env image
      shell: bash
      run: |
        echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${GITHUB_USERNAME} --password-stdin
        docker pull ${{inputs.dev_env_image}}

    - name: Build artifact docker image
      shell: bash
      run: |
        git branch

        if [ "${{inputs.is_asan_mode}}" = "yes" ]; then
          build_type="ASAN"
        else
          build_type="Release"
        fi
        echo "Build type is ${build_type}"

        # Build image and always remove intermediate containers.
        DOCKER_BUILDKIT=1 docker buildx build --force-rm=true \
          --build-arg RELEASE_VERSION=${{inputs.image_tag}} \
          --build-arg builder=${{inputs.dev_env_image}} \
          --build-arg BUILD_TYPE=${build_type} \
          -f docker/dockerfiles/artifacts/artifact.Dockerfile \
          -t starrocks-artifacts:${{inputs.image_tag}} .

    - name: Push to GHCR
      if: ${{inputs.to_push == 'true'}}
      uses: ./.github/actions/push-to-registry
      with:
        local_image: starrocks-artifacts:${{inputs.image_tag}}
        remote_image: ghcr.io/celonis/celostar/starrocks-artifacts:${{inputs.image_tag}}

