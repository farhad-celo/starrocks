          docker pull ghcr.io/celonis/celostar/starrocks-artifacts:${test_image_tag}

      - name: Build and push fe-be
        uses: ./.github/actions/build-fe-be
        with:
          artifact_image: ghcr.io/celonis/celostar/starrocks-artifacts:${{ env.test_image_tag }}
          image_tag: ${{ env.image_tag }}
          to_push: 'true'
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Build FE & BE
