name: '[RepoDepot] Build Dev Branch'
run-name: '[RepoDepot] Build Dev Branch: ${{ github.ref_name }}'

# paths-ignore is baked in at delivery time by merging org-level defaults with the service's
# own list from .github/repodepot-config.yaml. Do not edit this list by hand — changes will
# be overwritten on the next enrollment. To add service-specific ignores, update
# .github/repodepot-config.yaml (see repodepot-config.schema.json for the config schema).
on:
  push:
    branches:
      - branch-3.5-cc-ce1789ea-celo
    paths-ignore:
      - '.claude/**'
      - '.cursor/**'
      - '.mirrord/**'
      - '*'
      - '.devcontainer/**'
      - '.devcontainer-sr-main/**'
      - '.github/**'
      - 'build-support/**'
      - 'celonis/**'
      - 'celostar-docs/**'
      - 'community/**'
      - 'conf/**'
      - 'contrib/**'
      - 'docker/**'
      - 'docs/**'
      - 'extra/**'
      - 'format-sdk/**'
      - 'fs_brokers/**'
      - 'gensrc/**'
      - 'images/**'
      - 'java-extensions/**'
      - 'licenses/**'
      - 'licenses-binary/**'
      - 'test/**'
      - 'webroot/**'

  workflow_dispatch:
    inputs:
      service-name:
        type: choice
        description: Component to Build
        required: true
        options:
          - celostar-be
          - celostar-fe
          - '~~ALL~~'

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  on-push:
    name: Build Branch on Push
    if: vars.REPO_DEPOT_DEV_BRANCH_BUILDS_ENABLED == 'true' && github.event_name == 'push'
    uses: celonis/repo-depot/.github/workflows/reusable-create-release-candidate.yaml@stable
    secrets: inherit
    with:
      target-release: DEV
      repo-depot-version: stable
      service-names-as-csv: 'celostar-be,celostar-fe'

  on-dispatch:
    name: Build Branch on Dispatch
    if: github.event_name == 'workflow_dispatch'
    uses: celonis/repo-depot/.github/workflows/reusable-create-release-candidate.yaml@stable
    secrets: inherit
    with:
      target-release: DEV
      repo-depot-version: stable
      service-names-as-csv: ${{ inputs.service-name == '~~ALL~~' && 'celostar-be,celostar-fe' || inputs.service-name }}
