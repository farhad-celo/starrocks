name: '[RepoDepot] Re-Deliver on Config Change'
run-name: '[RepoDepot] Re-Deliver on Config Change: ${{ github.ref_name }}'

# Triggered when .github/repodepot-config.yaml changes on the default branch.
# Re-enrolls this service so that the updated config is baked into the delivered workflows.
# Do not edit this file by hand — changes will be overwritten on the next enrollment.
concurrency:
  group: repodepot-redeliver-on-config-change-${{ github.repository }}
  cancel-in-progress: true

on:
  push:
    branches:
      - branch-3.5-cc-ce1789ea-celo
    paths:
      - '.github/repodepot-config.yaml'

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  re-enroll:
    name: Re-Enroll on Config Change
    uses: celonis/repo-depot/.github/workflows/reusable-enroll-for-releases.yaml@stable
    with:
      repo-depot-version: stable
      repository-name: celonis/celostar-starrocks
      service-name: celostar-fe
      skip-eligibility-check: true
    secrets: inherit
