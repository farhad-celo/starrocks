message TimelineOperatorNode {
  enum TimelineReturnType {
    COLUMN = 1;
    TABLE = 2;
  }

  enum TimelineTimeUnit {
    YEAR = 1;
    QUARTER = 2;
    MONTH = 3;
    WEEK = 4;
    DAY = 5;
    HOUR = 6;
    MINUTE = 7;
  }

  message TimelinePartitionConfiguration {
    enum TimelinePartitionBorderType {
      FIRST_OCCURRENCE = 1;
      LAST_OCCURRENCE = 2;
      TIMELINE_START = 3;
      TIMELINE_END = 4;
    }

    required TimelinePartitionBorderType from_border_type = 1;
    required TimelinePartitionBorderType to_border_type = 2;
  }

  message TimelinePartition {
    repeated OperatorRef partition_expressions = 1;
    required TimelinePartitionConfiguration partition_configuration = 2;
  }

  required OperatorMetadata metadata = 1;
  required TimelineReturnType return_type = 2;
  required TimelineTimeUnit time_unit = 3;
  repeated OperatorRef timestamp_columns_expressions = 4;
  optional TimelinePartition partition = 5;
  optional OperatorRef range_start = 6;
  optional OperatorRef range_end = 7;
  required string timeline_table_cache_key = 8;
}

