name: 'celostar-starrocks release'

# **What it does**: Renders the content of every page and check all internal links.
# **Why we have it**: To make sure all links connect correctly.
# **Who does it impact**: Docs content.

on:
  release:
    types: [published]

permissions:
  contents: read
  # Needed for the 'trilom/file-changes-action' action
  pull-requests: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  RELEASE_VERSION: ${{ github.ref_name }}
  GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

jobs:
  release-starrocks:
    runs-on: [self-hosted, saola-linux]
    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: GitHub Docker login
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${{ github.repository }} --password-stdin

      - name: build artifact docker image
        run: |
          DOCKER_BUILDKIT=1 docker build --build-arg CODE_SOURCE=local -f celonis/docker/StarrocksBuilder/StarrocksBuilder.Dockerfile -t starrocks-artifacts:${RELEASE_VERSION} .

      - name: build allin1 docker image
        run: |
          DOCKER_BUILDKIT=1 docker build --build-arg ARTIFACTIMAGE=starrocks-artifacts:${RELEASE_VERSION} -f celonis/docker/allin1/Dockerfile -t starrocks-allin1:${RELEASE_VERSION} celonis/docker/allin1

      - name: push allin1 docker image to GHCR
        run: |
          docker tag starrocks-allin1:${RELEASE_VERSION} ghcr.io/celonis/celostar/starrocks-allin1:${RELEASE_VERSION}
          
          # Pushing to the GitHub packages docker registry regularly fails with "unknown blob" errors. The "fix" suggested by GitHub is looping.
          until docker push ghcr.io/celonis/celostar/starrocks-allin1:${RELEASE_VERSION}
          do
            echo "Could not push ghcr.io/celonis/celostar/starrocks-allin1:${RELEASE_VERSION} trying again."
          done

      - name: GitHub Docker logout
        if: ${{ always() }}
        run: |
          docker logout ghcr.io

      - name: Configure prod AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: prod Amazon ECR login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: push allin1 docker image to prod ECR
        run: |         
          # push to the prod ECR
          docker tag starrocks-allin1:${RELEASE_VERSION} 652406827250.dkr.ecr.eu-central-1.amazonaws.com/celostar/starrocks-allin1:${RELEASE_VERSION}
          docker push 652406827250.dkr.ecr.eu-central-1.amazonaws.com/celostar/starrocks-allin1:${RELEASE_VERSION}

      - name: Amazon ECR logout
        if: ${{ always() }}
        run: |
          docker logout ${{ steps.login-ecr.outputs.registry }}

