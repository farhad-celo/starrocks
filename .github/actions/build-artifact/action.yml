name: Build artifact image

inputs:
  dev_env_image:
    required: true
  image_tag:
    required: true
  release_version:
    description: "Version string to embed into StarRocks artifacts. Defaults to image_tag."
    required: false
    default: ''
  is_asan_mode:
    description: "Whether to build in ASAN mode"
    required: false
  branch:
    required: false
  to_push:
    description: "Whether to push the artifact to GHCR"
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Pull dev env image
      shell: bash
      run: |
        echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${GITHUB_USERNAME} --password-stdin
        docker pull ${{inputs.dev_env_image}}

    - name: GitHub Docker login
      shell: bash
      run: |
        echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${{ github.repository }} --password-stdin

    - name: Build artifact docker image
      shell: bash
      run: |
        git branch

        if [ "${{inputs.is_asan_mode}}" = "yes" ]; then
          build_type="ASAN"
        else
          build_type="Release"
        fi
        echo "Build type is ${build_type}"
        
        release_version="${{ inputs.release_version }}"
        if [ -z "${release_version}" ]; then
          release_version="${{ inputs.image_tag }}"
        fi
        echo "Release version is ${release_version}"

        dd_agent_version="1.56.3"

        # Build image and always remove intermediate containers.
        DOCKER_BUILDKIT=1 docker build --no-cache --force-rm=true \
          --build-arg RELEASE_VERSION="${release_version}" \
          --build-arg builder=${{inputs.dev_env_image}} \
          --build-arg BUILD_TYPE=${build_type} \
          --build-arg DD_AGENT_VERSION=${dd_agent_version} \
          -f docker/dockerfiles/artifacts/artifact.Dockerfile \
          -t starrocks-artifacts:${{inputs.image_tag}} .

    - name: Push to GHCR
      if: ${{inputs.to_push == 'true'}}
      uses: ./.github/actions/push-to-registry
      with:
        local_image: starrocks-artifacts:${{inputs.image_tag}}
        remote_image: ghcr.io/celonis/celostar/starrocks-artifacts:${{inputs.image_tag}}

