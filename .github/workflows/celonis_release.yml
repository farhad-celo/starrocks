name: 'celostar-starrocks release'
run-name: 'Celostar-Starrocks release: ${{ github.ref_name }}'

on:
  release:
    types: [published]

permissions:
  contents: write
  # Needed for the 'trilom/file-changes-action' action
  pull-requests: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  RELEASE_VERSION: ${{ github.ref_name }}
  IMAGE_TAG: ${{ github.ref_name }}
  BUILD_TYPE: Release
  ASAN_RELEASE_VERSION: "${{ github.ref_name }}-asan"
  ASAN_IMAGE_TAG: "${{ github.ref_name }}-asan"
  ASAN_BUILD_TYPE: ASAN
  GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
  GITHUB_USERNAME: ${{ github.repository }}
  BUILDER: ghcr.io/celonis/celostar/starrocks-dev-env:cpml-new-source

jobs:
  build-image:
    runs-on: [runs-on,runner=64cpu-linux-x64,image=ubuntu22-full-x64,disk=large,"run-id=${{ github.run_id }}"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: update docker data root
        run: |
          echo '{"data-root": "/home/runner/_work/docker"}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
          sudo cat /etc/docker/daemon.json

      - name: Pull dev env image
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${{ github.repository }} --password-stdin
          docker pull ${BUILDER}

      - name: Build artifact image
        uses: ./.github/actions/build-artifact
        with:
          dev_env_image: ${BUILDER}
          image_tag: ${IMAGE_TAG}
          to_push: false

      - name: Build and push allin1 image
        uses: ./.github/actions/build-allin1
        with:
          artifact_image: starrocks-artifacts:${IMAGE_TAG}
          image_tag: ${IMAGE_TAG}
          pull_artifact: false
          clean_up_artifact_image: false

      - name: Build FE & BE
        uses: ./.github/actions/build-fe-be
        with:
          artifact_image: starrocks-artifacts:${IMAGE_TAG}
          image_tag: ${IMAGE_TAG}

      - name: GHCR login
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${GITHUB_USERNAME} --password-stdin
      - name: Push FE image to GHCR
        uses: ./.github/actions/push-to-registry
        with:
          local_image: starrocks-fe:${IMAGE_TAG}
          remote_image: ghcr.io/celonis/celostar/starrocks-fe:${IMAGE_TAG}
      - name: Push BE docker image to GHCR
        uses: ./.github/actions/push-to-registry
        with:
          local_image: starrocks-be:${IMAGE_TAG}
          remote_image: ghcr.io/celonis/celostar/starrocks-be:${IMAGE_TAG}
      - name: GitHub Docker logout
        if: ${{ always() }}
        run: |
          docker logout ghcr.io

      - name: Configure prod AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: prod Amazon ECR login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push FE image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: ./.github/actions/push-to-registry
        with:
          local_image: starrocks-fe:${IMAGE_TAG}
          remote_image: ${{ env.ECR_REGISTRY }}/celostar/starrocks-fe:${IMAGE_TAG}
      - name: Push BE image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: ./.github/actions/push-to-registry
        with:
          local_image: starrocks-be:${IMAGE_TAG}
          remote_image: ${{ env.ECR_REGISTRY }}/celostar/starrocks-be:${IMAGE_TAG}


