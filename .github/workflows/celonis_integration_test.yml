        uses: ./.github/actions/trigger-celostar-test
        with:
          owner: celonis
          repo: celostar
          workflow_file: "e2e.yml"
          payload: > 
            { 
              \"event_type\":\"trigger_e2e_test\",
              \"client_payload\": {
                \"e2e_job_name\":\"${test_image_tag}\",
                \"cluster\":\"stateless\",
                \"starrocks_image_tag\":\"${test_image_tag}\",
                \"dataset\":\"abb_06b_stable\",
                \"query_option\":\"single_query_and_export_csv\",
                \"explain_mode\":\"disable\",
