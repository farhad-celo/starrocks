name: 'Presubmit Test'

on:
  pull_request:
    # If you update paths-ignore, please update celonis_presubmit_test_ignore.yml accordingly.
    paths-ignore:
      - '**.md'
      - '**.png'
      - 'celonis/assets/**'
      - '.github/**'
      - '!.github/workflows/celonis_presubmit_test.yml'
      - 'celonis/tools/**'
      - '!celonis/tools/presubmit/**'
      - '!celonis/tools/gtest-parallel/**'
      - 'celonis/docker/**'
      - 'docker/**'
      - '**/catalog-info.yaml'
  # To manually trigger the workflow. For debugging purpose.
  workflow_dispatch:

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  RELEASE_VERSION: presubmit-test
  GITHUB_USERNAME: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

jobs:
  setup:
    runs-on: [runs-on, runner=1cpu-linux-arm64, "run-id=${{ github.run_id }}"]
    outputs:
      builder_image: "ghcr.io/celonis/celostar/starrocks-dev-env:3.5-cc-86b916f9"
    steps:
      - run: echo "Setting dev env image"

  presubmit-test:
    runs-on: [runs-on,runner=64cpu-linux-x64,image=ubuntu22-full-x64,volume=200g,"run-id=${{ github.run_id }}",ssh=true]
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check Celonis's first commit
        shell: bash
        run: |
          first_commit=$(git log --grep="\[Refactor\] Transplant Celonis commits from branch-2.4-ubuntu to" --format="%H")
          
          if [ -z $first_commit ]; then
          echo "First commit Not found, existing..."
          exit 1
          else
          echo "First commit found - $first_commit"
          fi
          
          # TODO: fix first commit check
          #celonis_first_commit_date=$(git log $first_commit --format="%at" -n 1)
          #starrocks_latest_commit_date=$(git log $first_commit^ --format="%at" -n 1)
          #
          ## check time
          #if [ "$celonis_first_commit_date" -gt "$starrocks_latest_commit_date" ]; then
          #echo "Celonis's first commit should be on the top of the latest Starrocks' commit"
          #exit 1
          #fi
          #
          #echo "Time check passed" 

      - name: Pull dev env image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.setup.outputs.builder_image }}

      - name: Presubmit test
        timeout-minutes: 60
        uses: ./.github/actions/presubmit-test
        with:
          builder: ${{ needs.setup.outputs.builder_image }}
      
  fe-test:
    runs-on: [runs-on,runner=64cpu-linux-x64,image=ubuntu22-full-x64,disk=large,"run-id=${{ github.run_id }}"]
    needs: setup
    container:
      image: ${{ needs.setup.outputs.builder_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes in 'fe/' folder
        shell: bash
        id: check_fe_changed
        run: |
          git config --global --add safe.directory $(pwd)

          # Fetch base branch
          if [ -n "${{ github.base_ref }}" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            # `github.base_ref` is empty for just commits without a PR, in that case we use the default branch.
            TARGET_BRANCH="${{ github.event.repository.default_branch }}"
          fi

          git fetch origin ${TARGET_BRANCH}
          # Compare the current state against the base branch, and check for FE changes
          if git diff --quiet origin/${TARGET_BRANCH} -- fe/; then
            echo "No changes in fe/*"
            echo "fe_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in fe/*"
            echo "fe_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: FE unit tests
        timeout-minutes: 75
        if: ${{ steps.check_fe_changed.outputs.fe_changed == 'true' }}
        uses: ./.github/actions/fe-unit-tests
