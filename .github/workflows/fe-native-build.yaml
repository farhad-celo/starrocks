name: Celostar-Starrocks FE Native Build
on:
  workflow_dispatch:
    inputs:
      component-name:
        required: true
        type: string
      version:
        required: true
        type: string
      relative-source-location:
        required: true
        type: string
      release-branch:
        required: true
        type: string
      github-token:
        required: false
        default: ''
        type: string
      image-registry:
        description: The name of the container registry to use when creating an image.
        required: false
        default: '652406827250.dkr.ecr.eu-central-1.amazonaws.com'
      image-name:
        description: The name of the image to use when creating a image.
        required: true
      image-tag:
        description: The name of the image tag to use when creating a image.
        required: true
      for_dic:
        description: Whether the allin1 image should include DIC-oriented FE/BE settings.
        required: false
        default: false
        type: boolean
      branch:
        description: Optional git branch to checkout before building the FE image (passed to build-fe).
        required: false
        default: ''
        type: string
      celostar-docker-tag:
        description: Celostar Docker tag (pr<pr-number>-<version>) passed through to the manifest publisher.
        required: false
        default: ''
        type: string

env:
  BUILDER: ghcr.io/celonis/celostar/starrocks-dev-env:3.5-cc-86b916f9
  GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
  GITHUB_USERNAME: ${{ github.repository }}

run-name: Build FE ${{ inputs.component-name }} - ${{ inputs.version }}
jobs:
  build-ubuntu:
    name: Ubuntu Release FE (${{ matrix.image_suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: 64cpu-linux-x64,volume=150g
            image_suffix: x86
            ubuntu_image: ubuntu24-full-x64
          - arch: arm64
            runner: 64cpu-linux-arm64,volume=150g
            image_suffix: arm
            ubuntu_image: ubuntu24-full-arm64
    runs-on: ['runs-on', 'runner=${{ matrix.runner }}', 'image=${{ matrix.ubuntu_image }}', 'disk=large', 'run-id=${{ github.run_id }}']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}
          token: ${{ inputs.github-token || secrets.GITHUB_TOKEN }}

      - name: Native Compilation (component path)
        shell: bash
        run: |
          echo "Compiling FE ${{ inputs.component-name }} for ${{ matrix.arch }}..."
          cd "${{ inputs.relative-source-location }}"

      - name: Build artifact image
        id: build-artifact
        uses: ./.github/actions/build-artifact
        with:
          dev_env_image: ${{ env.BUILDER }}
          image_tag: ${{ inputs.image-tag }}-${{ matrix.image_suffix }}
          release_version: ${{ inputs.celostar-docker-tag }}
          to_push: 'true'

      - name: Build and push FE image
        uses: ./.github/actions/build-fe
        with:
          artifact_image: ghcr.io/celonis/celostar/starrocks-artifacts:${{ inputs.image-tag }}-${{ matrix.image_suffix }}
          image_tag: ${{ inputs.image-tag }}-${{ matrix.image_suffix }}
          branch: ${{ inputs.branch }}
          to_push: 'true'
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  build-debian12:
    name: Debian 12 FE (${{ matrix.image_suffix }})
    needs: [build-ubuntu]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: 64cpu-linux-x64,volume=150g
            image_suffix: x86
            ubuntu_image: ubuntu24-full-x64
          - arch: arm64
            runner: 64cpu-linux-arm64,volume=150g
            image_suffix: arm
            ubuntu_image: ubuntu24-full-arm64
    runs-on: ['runs-on', 'runner=${{ matrix.runner }}', 'image=${{ matrix.ubuntu_image }}', 'disk=large', 'run-id=${{ github.run_id }}']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}
          token: ${{ inputs.github-token || secrets.GITHUB_TOKEN }}

      - name: Build and push FE image (Debian12)
        uses: ./.github/actions/build-fe
        with:
          artifact_image: ghcr.io/celonis/celostar/starrocks-artifacts:${{ inputs.image-tag }}-${{ matrix.image_suffix }}
          image_tag: ${{ inputs.image-tag }}-debian12-${{ matrix.image_suffix }}
          branch: ${{ inputs.branch }}
          to_push: 'true'
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          fe_dockerfile: 'docker/dockerfiles/fe/fe-debian12.Dockerfile'

  build-asan:
    name: ASAN FE (${{ matrix.asan_suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: 64cpu-linux-x64,volume=150g
            asan_suffix: amd64
            ubuntu_image: ubuntu22-full-x64
          - arch: arm64
            runner: 64cpu-linux-arm64,volume=150g
            asan_suffix: arm64
            ubuntu_image: ubuntu22-full-arm64
    runs-on: ['runs-on', 'runner=${{ matrix.runner }}', 'image=${{ matrix.ubuntu_image }}', 'disk=large', 'run-id=${{ github.run_id }}']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}
          token: ${{ inputs.github-token || secrets.GITHUB_TOKEN }}

      - name: Build ASAN artifact image
        uses: ./.github/actions/build-artifact
        with:
          dev_env_image: ${{ env.BUILDER }}
          image_tag: ${{ inputs.image-tag }}-asan-${{ matrix.asan_suffix }}
          release_version: ${{ inputs.celostar-docker-tag && format('{0}-asan', inputs.celostar-docker-tag) || '' }}
          is_asan_mode: 'yes'
          to_push: 'true'

      - name: Build and push ASAN FE image
        uses: ./.github/actions/build-fe
        with:
          artifact_image: ghcr.io/celonis/celostar/starrocks-artifacts:${{ inputs.image-tag }}-asan-${{ matrix.asan_suffix }}
          image_tag: ${{ inputs.image-tag }}-asan-${{ matrix.asan_suffix }}
          branch: ${{ inputs.branch }}
          to_push: 'true'
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  build-and-push-manifest:
    runs-on: [runs-on, runner=1cpu-linux-arm64, "run-id=${{ github.run_id }}"]
    needs: [build-ubuntu]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}
          token: ${{ inputs.github-token || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/publish-celostar-manifests
        with:
          tag_arm: ${{ inputs.image-tag }}-arm
          tag_x86: ${{ inputs.image-tag }}-x86
          tag_combined: ${{ inputs.image-tag }}
          publish_be: 'false'
          publish_fe: 'true'
          publish_allin1: 'false'
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          celostar_docker_tag: ${{ inputs.celostar-docker-tag }}

  build-and-push-debian12-manifest:
    runs-on: [runs-on, runner=1cpu-linux-arm64, "run-id=${{ github.run_id }}"]
    needs: [build-debian12]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}
          token: ${{ inputs.github-token || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/publish-celostar-manifests
        with:
          tag_arm: ${{ inputs.image-tag }}-debian12-arm
          tag_x86: ${{ inputs.image-tag }}-debian12-x86
          tag_combined: ${{ inputs.image-tag }}-debian12
          publish_be: 'false'
          publish_fe: 'true'
          publish_allin1: 'false'
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          celostar_docker_tag: ${{ inputs.celostar-docker-tag }}-debian12

  build-and-push-asan-manifest:
    runs-on: [runs-on, runner=1cpu-linux-x64, "run-id=${{ github.run_id }}"]
    needs: [build-asan]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-branch }}
          token: ${{ inputs.github-token || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/publish-celostar-manifests
        with:
          tag_arm: ${{ inputs.image-tag }}-asan-arm64
          tag_x86: ${{ inputs.image-tag }}-asan-amd64
          tag_combined: ${{ inputs.image-tag }}-asan
          publish_be: 'false'
          publish_fe: 'true'
          publish_allin1: 'false'
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          celostar_docker_tag: ${{ inputs.celostar-docker-tag }}-asan
