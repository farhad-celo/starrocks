name: Publish Celostar multi-arch image manifests
description: >-
  Creates and pushes manifest lists for starrocks-be, starrocks-fe (ECR + GHCR)
  and starrocks-allin1 (GHCR) from per-arch tags.

inputs:
  tag_arm:
    description: Image tag for the arm64 single-arch image (tag only, not full ref).
    required: true
  tag_x86:
    description: Image tag for the amd64 single-arch image.
    required: true
  tag_combined:
    description: Multi-arch manifest tag (allin1 + FE + BE use this on GHCR; FE/BE on ECR).
    required: true
  add_celostar_tag:
    description: Repo-depot doesn't allow custom release name, enable this will add an extra Celostar format tag
    required: false
    default: 'false'
  celostar_tag:
    description: >-
      The extra Celostar format tag (e.g. pr<pr-number>-<version>) to push when add_celostar_tag is true.
      Generated upstream (repodepot-custom-image) and passed through the native build workflows.
    required: false
    default: ''
  aws_access_key_id:
    description: AWS access key ID
    required: true
  aws_secret_access_key:
    description: AWS secret access key
    required: true
  publish_be:
    description: Publish starrocks-be multi-arch manifests (ECR + GHCR).
    required: false
    default: 'true'
  publish_fe:
    description: Publish starrocks-fe multi-arch manifests (ECR + GHCR).
    required: false
    default: 'true'
  publish_allin1:
    description: Publish starrocks-allin1 multi-arch manifest (GHCR).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: GHCR login
      shell: bash
      run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_USERNAME}" --password-stdin

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: eu-central-1

    - name: Amazon ECR login
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: GHCR — starrocks-allin1 manifest
      if: ${{ inputs.publish_allin1 == 'true' }}
      uses: ./.github/actions/build-mul-arch-manifest
      with:
        arm_image_tag: ghcr.io/celonis/celostar/starrocks-allin1:${{ inputs.tag_arm }}
        x86_image_tag: ghcr.io/celonis/celostar/starrocks-allin1:${{ inputs.tag_x86 }}
        mul_arch_image_tag: ghcr.io/celonis/celostar/starrocks-allin1:${{ inputs.tag_combined }}

    - name: ECR + GHCR — starrocks-be + starrocks-fe manifests
      if: ${{ inputs.publish_be == 'true' || inputs.publish_fe == 'true' }}
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        TAG_ARM: ${{ inputs.tag_arm }}
        TAG_X86: ${{ inputs.tag_x86 }}
        TAG_MULTI: ${{ inputs.tag_combined }}
        PUBLISH_BE: ${{ inputs.publish_be }}
        PUBLISH_FE: ${{ inputs.publish_fe }}
        ADD_CELOSTAR_TAG: ${{ inputs.add_celostar_tag }}
        CELOSTAR_TAG: ${{ inputs.celostar_tag }}
      run: |
        set -euo pipefail
        export DOCKER_CLI_EXPERIMENTAL=enabled
        echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_USERNAME}" --password-stdin

        images=()
        if [[ "${PUBLISH_BE}" == "true" ]]; then
          images+=(starrocks-be)
        fi
        if [[ "${PUBLISH_FE}" == "true" ]]; then
          images+=(starrocks-fe)
        fi

        # Registry prefixes (the "<registry>/<image>" part, minus the tag).
        registries=(
          "${ECR_REGISTRY}/celostar"
          "ghcr.io/celonis/celostar"
        )

        if [[ "${ADD_CELOSTAR_TAG}" == "true" ]]; then
          if [[ -z "${CELOSTAR_TAG}" ]]; then
            echo "::error::add_celostar_tag is true but celostar_tag input is empty."
            exit 1
          fi
          echo "Celostar tag: ${CELOSTAR_TAG}"
        fi

        for registry in "${registries[@]}"; do
          for image in "${images[@]}"; do
            mul_arch_tag="${registry}/${image}:${TAG_MULTI}"
            arm_tag="${registry}/${image}:${TAG_ARM}"
            x86_tag="${registry}/${image}:${TAG_X86}"
            docker manifest create "$mul_arch_tag" --amend "$arm_tag" --amend "$x86_tag"
            docker manifest push "$mul_arch_tag"

            if [[ "${ADD_CELOSTAR_TAG}" == "true" ]]; then
              celostar_image_tag="${registry}/${image}:${CELOSTAR_TAG}"
              docker manifest create "$celostar_image_tag" --amend "$arm_tag" --amend "$x86_tag"
              docker manifest push "$celostar_image_tag"
            fi
          done
        done
