name: Integration Test
run-name: Integration Test - ${{inputs.branch_to_test || 'sync and rebase upstream'}}

on:
  schedule:
    - cron:  '0 7 * * 0,2,4' # Around Pacific time of midnight of Sunday, Tuesday and Thursday
  workflow_dispatch:
    inputs:
      branch_to_test:
        description: "The branch to build images and run tests. If empty, will rebase upstream code and then build images to test"
        default: ''
      image_to_build:
        description: "The image tag to build. Only take effect when above input is not empty. If empty, will construct one from the above input branch name"
        default: ''

env:
  LATEST_UPSTREAM_BRANCH: branch-3.2
  BUILDER: ghcr.io/celonis/celostar/starrocks-dev-env:3.2-8107c630-locale-cpml2.177-ubuntu
  GITHUB_USERNAME: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

permissions:
  contents: write
  pull-requests: read

jobs:
  sync-and-rebase-upstream:
    runs-on: [self-hosted, celostar]
    outputs:
      test_branch: ${{steps.rebase.outputs.test_branch || inputs.branch_to_test}}
      test_image_tag: ${{steps.rebase.outputs.test_branch || steps.image_tag_output.outputs.test_image_tag}}
    steps:
      - name: Output image tag
        if: ${{inputs.branch_to_test != ''}}
        id: image_tag_output
        run: |
          branch=${{inputs.branch_to_test}}
          echo "The branch to test is: ${branch}"
          if [[ -n "${{inputs.image_to_build}}" ]]; then
            image_tag="${{inputs.image_to_build}}"
            # Check if the tag contains only valid characters
            if ! [[ "$image_tag" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "Invalid image tag: must contain only lowercase and uppercase letters, digits, underscores (_), periods (.), and dashes (-)."
              exit 1
            elif [[ "$image_tag" =~ ^[.-] ]]; then
              echo "Invalid image tag: must not start with a period (.) or a dash (-)."
              exit 1
            fi
          else
            image_tag="${branch//\//_}"
          fi
          echo "The test image tag to build is: ${image_tag}"
          echo "test_image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{inputs.branch_to_test == ''}}
        uses: actions/checkout@v4

      - name: Rebase
        if: ${{inputs.branch_to_test == ''}}
        id: rebase
        run: |
          chmod +x celonis/tools/rebase/rebase.sh
          n=0
          until [ "$n" -ge 3 ]
          do
            celonis/tools/rebase/rebase.sh && break
            n=$((n+1))
            echo "Retry $n/3..."
            sleep 5
          done

          if [ "$n" -ge 3 ]; then
            echo "All retries failed."
            exit 1
          fi
      - name: Sum up
        if: ${{inputs.branch_to_test == ''}}
        shell: bash
        run: |
          {
            echo "The new default branch is ${{env.new_default_branch}}"
            echo "The test branch is ${{env.test_branch}}"
          } >> $GITHUB_STEP_SUMMARY

  presubmit-test:
    runs-on: [self-hosted, celostar]
    # No need to run presubmit test on existing branch as the pull request of the branch will trigger it.
    if: inputs.branch_to_test == ''
    needs: sync-and-rebase-upstream
    env:
      test_branch: ${{needs.sync-and-rebase-upstream.outputs.test_branch}}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull dev env image
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${GITHUB_USERNAME} --password-stdin
          docker pull ${BUILDER}

      - name: Test
        uses: ./.github/actions/presubmit-test
        with:
          builder: ${BUILDER}
          branch: ${{env.test_branch}}

  build-artifact:
    runs-on: [self-hosted, celostar]
    needs: sync-and-rebase-upstream
    env:
      test_image_tag: ${{needs.sync-and-rebase-upstream.outputs.test_image_tag}}
      test_branch: ${{needs.sync-and-rebase-upstream.outputs.test_branch}}
    outputs:
      test_branch: ${{env.test_branch}}
      artifact_image_tag: ${{env.test_image_tag}}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build and push artifact image
        id: build-artifact
        uses: ./.github/actions/build-artifact
        with:
          dev_env_image: ${BUILDER}
          image_tag: ${test_image_tag}
          branch: ${test_branch}

  build-allin1:
    runs-on: [self-hosted, celostar]
    needs: build-artifact
    env:
      test_branch: ${{needs.build-artifact.outputs.test_branch}}
      artifact_image_tag: ${{needs.build-artifact.outputs.artifact_image_tag}}
    outputs:
      allin1_image_tag: ${{env.artifact_image_tag}}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build and push allin1 image
        uses: ./.github/actions/build-allin1
        with:
          artifact_image: ghcr.io/celonis/celostar/starrocks-artifacts:${artifact_image_tag}
          image_tag: ${artifact_image_tag}
          branch: ${test_branch}

  celostar-presubmit-test:
    runs-on: [self-hosted, celostar]
    needs: build-allin1
    env:
      test_image_tag: ${{needs.build-allin1.outputs.allin1_image_tag}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run celostar compliance test
        id: run-test
        uses: ./.github/actions/trigger-celostar-test
        with:
          owner: celonis
          repo: celostar
          workflow_file: "presubmit-test.yml"
          payload: '{\"event_type\":\"trigger_presubmit_test\",\"client_payload\":{\"image_tag\":\"${test_image_tag}\"}}'

      - name: Summarize the result
        if: always() && steps.run-test.outcome != 'skipped'
        run: |
          {
            echo "The presubmit test workflow is: ${{steps.run-test.outputs.workflow_url}}"
          } >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  build-fe-be:
    runs-on: [self-hosted, celostar]
    needs: build-artifact
    env:
      test_branch: ${{needs.build-artifact.outputs.test_branch}}
      test_image_tag: ${{needs.build-artifact.outputs.artifact_image_tag}}
    outputs:
      test_image_tag: ${{env.test_image_tag}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull artifact image
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${GITHUB_USERNAME} --password-stdin
          docker pull ghcr.io/celonis/celostar/starrocks-artifacts:${test_image_tag}

      - name: Build FE & BE
        uses: ./.github/actions/build-fe-be
        with:
          artifact_image: ghcr.io/celonis/celostar/starrocks-artifacts:${test_image_tag}
          image_tag: ${test_image_tag}
          branch: ${test_branch}

      - name: Push FE image to GHCR
        uses: ./.github/actions/push-to-registry
        with:
          local_image: starrocks-fe:${test_image_tag}
          remote_image: ghcr.io/celonis/celostar/starrocks-fe:${test_image_tag}

      - name: Push BE image to GHCR
        uses: ./.github/actions/push-to-registry
        with:
          local_image: starrocks-be:${test_image_tag}
          remote_image: ghcr.io/celonis/celostar/starrocks-be:${test_image_tag}

      - name: Configure prod AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: prod Amazon ECR login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push FE image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: ./.github/actions/push-to-registry
        with:
          local_image: starrocks-fe:${test_image_tag}
          remote_image: ${{ env.ECR_REGISTRY }}/celostar/starrocks-fe:${test_image_tag}

      - name: Push BE image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: ./.github/actions/push-to-registry
        with:
          local_image: starrocks-be:${test_image_tag}
          remote_image: ${{ env.ECR_REGISTRY }}/celostar/starrocks-be:${test_image_tag}

      - name: clean up
        if: ${{ always() }}
        run: |
          docker rmi -f $(docker images -q starrocks-fe:${test_image_tag}) || true
          docker rmi -f $(docker images -q starrocks-be:${test_image_tag}) || true
          docker rmi -f $(docker images -q ghcr.io/celonis/celostar/starrocks-artifacts:${test_image_tag}) || true
          docker system prune -f
          docker volume prune -f
          docker logout ghcr.io
        continue-on-error: true

  celostar-e2e-test:
    runs-on: [self-hosted, celostar]
    needs: build-fe-be
    env:
      test_image_tag: ${{needs.build-fe-be.outputs.test_image_tag}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run celostar e2e test
        id: run-test
        uses: ./.github/actions/trigger-celostar-test
        with:
          owner: celonis
          repo: celostar
          workflow_file: "e2e.yml"
          payload: '{\"event_type\":\"trigger_e2e_test\",\"client_payload\":{\"e2e_job_name\":\"${test_image_tag}\",\"cluster\":\"stateless\",\"starrocks_image_tag\":\"${test_image_tag}\",\"dataset\":\"abb_10m\",\"query_option\":\"single_query\"}}'

      - name: Summarize the result
        if: always() && steps.run-test.outcome != 'skipped'
        run: |
          {
            echo "The E2E test workflow is: ${{steps.run-test.outputs.workflow_url}}"
          } >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  build-asan-artifact:
    runs-on: [self-hosted, celostar]
    needs: sync-and-rebase-upstream
    env:
      test_branch: ${{needs.sync-and-rebase-upstream.outputs.test_branch}}
      test_image_tag: "${{needs.sync-and-rebase-upstream.outputs.test_image_tag}}-asan"
    outputs:
      test_branch: ${{env.test_branch}}
      test_image_tag: ${{env.test_image_tag}}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build and push artifact image
        uses: ./.github/actions/build-artifact
        with:
          dev_env_image: ${BUILDER}
          image_tag: ${test_image_tag}
          is_asan_mode: 'yes'
          branch: ${test_branch}

  build-asan-allin1:
    runs-on: [self-hosted, celostar]
    needs: build-asan-artifact
    env:
      test_branch: ${{needs.build-asan-artifact.outputs.test_branch}}
      test_image_tag: ${{needs.build-asan-artifact.outputs.test_image_tag}}
    outputs:
      allin1_image_tag: ${{env.test_image_tag}}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build and push asan allin1 image
        uses: ./.github/actions/build-allin1
        with:
          artifact_image: ghcr.io/celonis/celostar/starrocks-artifacts:${test_image_tag}
          image_tag: ${test_image_tag}
          branch: ${test_branch}

  celostar-compliance-test:
    runs-on: [self-hosted, celostar]
    needs: build-asan-allin1
    env:
      test_image_tag: ${{needs.build-asan-allin1.outputs.allin1_image_tag}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run celostar compliance test
        id: run-test
        uses: ./.github/actions/trigger-celostar-test
        with:
          owner: celonis
          repo: celostar
          workflow_file: "compliance-test.yml"
          payload: '{\"event_type\":\"trigger_compliance_test\",\"client_payload\":{\"image_tag\":\"${test_image_tag}\"}}'

      - name: Summarize the result
        if: always() && steps.run-test.outcome != 'skipped'
        run: |
          {
            echo "The compliance test workflow is: ${{steps.run-test.outputs.workflow_url}}"
          } >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
