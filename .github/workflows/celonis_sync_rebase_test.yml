name: Sync rebase upstream and test

on:
  schedule:
    # At 00:00 of pacific time.
    - cron:  '0 7 * * *'
  # Configuring a workflow to run manually
  workflow_dispatch:

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  LATEST_UPSTREAM_BRANCH: branch-3.1
  BUILDER: ghcr.io/celonis/celostar/starrocks-dev-env:branch-3.0-62d8aaf5-dev
  GITHUB_USERNAME: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  sync-rebase-upstream-and-test:
    runs-on: [self-hosted, celostar-starrocks-test]
    steps:
      - name: Start fresh
        run: |
          echo "Deleting the existing repo"
          # We need the repo directory exist to make the checkout action work.
          rm -rf /runner/_work/celostar-starrocks; mkdir -p /runner/_work/celostar-starrocks/celostar-starrocks; echo "Deletion done"
        # Ignore not existing error
        continue-on-error: true

      - name: Checkout repository
        uses: actions/checkout@v3
        # We need to ref a branch which is not the default one or ${LATEST_UPSTREAM_BRANCH} to make rebase work.
        with:
          ref: branch-3.0-c0d5082c-celo

      - name: Remote add upstream
        id: remote-add
        run: |
          git remote add upstream https://github.com/StarRocks/starrocks.git
        # Skip error of remote upstream already exists
        continue-on-error: true
      - name: Fetch upstream and push
        run: |
          git fetch upstream ${LATEST_UPSTREAM_BRANCH}:${LATEST_UPSTREAM_BRANCH}
          git push origin ${LATEST_UPSTREAM_BRANCH}
      - name: Rebase
        id: rebase
        run: |
          echo "Start to rebase ..."
          
          # Get the latest commit
          git fetch
          git checkout ${LATEST_UPSTREAM_BRANCH}
          latest_commit=$(git rev-parse --short=8 HEAD)
          echo "The latest commit is ${latest_commit}"
          
          # Create the new default branch
          newDefaultBranch=${LATEST_UPSTREAM_BRANCH}-${latest_commit}-celo
          echo "new_default_branch=$newDefaultBranch" >> $GITHUB_ENV
          git checkout -b ${newDefaultBranch}
          git push --set-upstream origin ${newDefaultBranch}
                    
          # Get the current default branch
          default_branch=$(git remote show origin | grep 'HEAD branch' | sed 's/^[[:space:]]*HEAD branch: //')
          echo "The current default branch is ${default_branch}"
          
          # Rebase
          git checkout ${default_branch}
          timestamp=$(date +'%Y-%m-%dT%H-%M-%S')
          echo "timestamp=$timestamp" >> $GITHUB_ENV
          testBranch=gh-rebase-${timestamp}
          echo "test_branch=$testBranch" >> $GITHUB_ENV
          git checkout -b $testBranch
          git rebase ${newDefaultBranch}
          git push --set-upstream origin $testBranch

      - name: GitHub Docker login
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${{ github.repository }} --password-stdin

      - name: Pull dev env image
        run: |
          docker pull ${BUILDER}
          
      - name: Build and test celostar-starrocks
        run: |
          git checkout ${{ env.test_branch }}
          echo "Starting the dev env container"
          container_id=$(docker run -d -v `pwd`:/celostar-starrocks \
          -w `pwd` --env GITHUB_TOKEN=${GITHUB_TOKEN} \
          --env GITHUB_USERNAME=${GITHUB_USERNAME} \
          ${BUILDER} sleep infinity)
          echo "Starting to build and test"
          docker exec ${container_id} sh -c "$(cat celonis/docker/presubmit/presubmit_test.sh)"

      - name: Build artifact docker image
        run: |
          git checkout ${{ env.test_branch }}
          # Build image and always remove intermediate containers.
          DOCKER_BUILDKIT=1 docker build --force-rm=true --build-arg RELEASE_VERSION=${{ env.test_branch }} --build-arg builder=${BUILDER} -f celonis/docker/artifact/artifact.Dockerfile -t starrocks-artifacts:${{ env.test_branch }} .

      - name: Package allin1 docker image
        run: |
          git checkout ${{ env.test_branch }}
          # Build image and always remove intermediate containers.
          DOCKER_BUILDKIT=1 docker build --force-rm=true --build-arg ARTIFACTIMAGE=starrocks-artifacts:${{ env.test_branch }} -f celonis/docker/allin1/allin1-ubuntu.Dockerfile -t starrocks-allin1:${{ env.test_branch }} celonis/docker/allin1
          echo "allin1_image_tag=starrocks-allin1:${{ env.test_branch }}" >> $GITHUB_ENV

      - name: Checkout celostar repo
        uses: actions/checkout@v3
        with:
          repository: celonis/celostar
          path: _celostar
          # Need to call the token explicitly again.
          token: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

      - name: Build and test celostar with the new allin1 image
        id: test-celostar
        run: |
          cd _celostar
          mvn clean package -DskipFormat -Dmaven.artifact.threads=128 -Dgithub.user=${{ github.repository }} \
          -Dgithub.password=${{ secrets.CELOBOT_GITHUB_TOKEN }} \
          -Dcelostar-starrocks-image=${{ env.allin1_image_tag }}

      # Need this step so that create-an-issue action could find the templates.
      - name: Recheckout the repo
        if: ${{ always() }}
        uses: actions/checkout@v3

      - name: Create the failure report
        if: ${{ failure() }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
        with:
          filename: .github/ISSUE_TEMPLATE/celonis_sync_rebase_test_failure_report.md

      - name: Create the success report
        if: ${{ steps.test-celostar.outcome }} == 'success'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
        with:
          filename: .github/ISSUE_TEMPLATE/celonis_sync_rebase_test_success_report.md

      - name: Docker logout and remove containers
        if: ${{ always() }}
        run: |
          docker logout ghcr.io
          docker rm -f $(docker ps -aq)
          echo "Done"
        continue-on-error: true

      - name: Docker cleanup
        if: ${{ always() }}
        run: |
          docker rmi -f $(docker images -q starrocks-artifacts:${{ env.test_branch }})
          docker rmi -f $(docker images -q ${{ env.allin1_image_tag }})
          docker system prune -f
          docker volume prune -f
          echo "Finished cleanup docker files"
        continue-on-error: true

      - name: Clean up celostar-starrocks repo
        if: ${{ always() }}
        run:
          # We need the repo directory exist to make the checkout action work.
          rm -rf /runner/_work/celostar-starrocks;
          mkdir -p /runner/_work/celostar-starrocks/celostar-starrocks;
          echo "Deletion done"
        continue-on-error: true