name: Create Image
description: Template action used to produce a image through a custom build process.

# Repo Depot will provide these inputs as part of the overarching workflow.
inputs:
  # The source repository from which a images should be created.
  working-directory:
    description: Relative path under $GITHUB_WORKSPACE to use when running commands.
    required: true
  image-registry:
    description: The name of the container registry to use when creating an image.
    required: true
  image-name:
    description: The name of the image to use when creating a image.
    required: true
  image-tag:
    description: The name of the image tag to use when creating a image.
    required: true
  github-token:
    description: The token to use when accessing Celonis resources.
    required: true
  sca-tag-ref:
    required: true
    default: ''
    description: 'string: Tag to reference for SCA scans'
  srcclr-api-token:
    required: true
    description: 'string: The API token for Sourceclear, typically set in a repository secret called SRCCLR_API_TOKEN'
  secrets:
    description: JSON encoded repository secrets
    required: true
  vars:
    description: JSON encoded repository variables
    required: true
  is-dev-build:
    description: Boolean indicating if the build is a development build
    required: true
  relative-source-location:
    description: The relative source location of a component (e.g. service, job, library, etc) in the GitHub repository.
    required: false
  component-name:
    description: The name of the component
    required: true

# Repo Depot expects these outputs to be set and to all be 'true' in order to continue
# the overarching workflow.
outputs:
  build-status:
    description: 'Indicates whether the build was successful (type: boolean, values: true/false).'
    value: ${{ steps.build.outputs.status }}
  test-status:
    description: 'Indicates whether the testing was successful (type: boolean, values: true/false).'
    value: ${{ steps.test.outputs.status }}

  # See https://github.com/docker/build-push-action for more information.
  image-metadata:
    description: 'JSON metadata output from the docker image creation'
    value: ${{ steps.create-image.outputs.metadata }}

env:
  BUILDER: ghcr.io/celonis/celostar/starrocks-dev-env:3.5-94085107

runs:
  using: composite

  # The following steps are a framework for how this could work, not how it must work.
  #
  # Repo Depot has already logged in to ECR and GHCR.
  steps:

    - name: pull dev env image
      shell: bash
      run: |
        echo ${{ inputs.github-token }} | docker login ghcr.io -u ${{ github.repository }}
        docker pull ${{ env.BUILDER }}
        
        echo ${{ inputs.working-directory }}

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Build artifact docker image
      shell: bash
      run: |
        git branch

        build_type="Release"
        echo "Build type is ${build_type}"
        
        dd_agent_version="1.56.3"

        # Build image and always remove intermediate containers.
        DOCKER_BUILDKIT=1 docker build --no-cache --force-rm=true \
          --build-arg RELEASE_VERSION=${{inputs.image_tag}} \
          --build-arg builder=${{env.BUILDER}} \
          --build-arg BUILD_TYPE=${build_type} \
          -f docker/dockerfiles/artifacts/artifact.Dockerfile \
          -t starrocks-artifacts:${{inputs.image_tag}} .

