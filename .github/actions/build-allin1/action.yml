name: Build allin1 image

inputs:
  artifact_image:
    required: true
  image_tag:
    required: true
  branch:
    required: false
  oci_version:
    description: OCI version label for the single-architecture image.
    required: false
    default: ''
  pull_artifact:
    description: 'Whether to pull artifact image'
    required: false
    default: true
  for_dic:
    description: 'Whether the allin1 is for DIC purpose'
    required: false
    default: false
  clean_up_artifact_image:
    description: 'Whether to clean up the artifact image'
    required: false
    default: true
  to_push:
    required: false
    default: 'true'
    description: "Whether to push the image to remote"
  allin1_dockerfile:
    required: false
    default: 'docker/dockerfiles/allin1/allin1-ubuntu.Dockerfile'
    description: "path to allin1 Dockerfile"

runs:
  using: composite
  steps:
    - name: GHCR login
      shell: bash
      run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

    - name: Authenticate to AWS (OIDC)
      if: ${{ inputs.to_push == 'true' }}
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: arn:aws:iam::652406827250:role/github-actions-org-oidc
        aws-region: eu-central-1

    - name: prod Amazon ECR login
      if: ${{ inputs.to_push == 'true' }}
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Pull artifact image
      if: ${{ inputs.pull_artifact == 'true' }}
      shell: bash
      run: docker pull "${{ inputs.artifact_image }}"

    - name: Build allin1 image with buildx
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        OCI_VERSION: ${{ inputs.oci_version }}
      run: |
        set -e

        IMAGE_TAG="${{ inputs.image_tag }}"
        ARTIFACT_IMAGE="${{ inputs.artifact_image }}"

        oci_labels=(
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
        )
        if [[ -n "${OCI_VERSION}" ]]; then
          oci_labels+=(--label "org.opencontainers.image.version=${OCI_VERSION}")
        fi

        # Add config
        echo "empty_load_as_error = false" >> docker/dockerfiles/allin1/fe.conf

        if [[ "${{ inputs.for_dic }}" == "true" ]]; then
          echo "Adding more configs for DIC"
          {
            echo 'JAVA_OPTS="-Xms8g -Xmx64g"'
            echo "max_varchar_length = 50000000"
          } >> docker/dockerfiles/allin1/fe.conf
          {
            echo "olap_string_max_length = 50000000"
            echo "disable_storage_page_cache = true"
          } >> docker/dockerfiles/allin1/be.conf
        fi

        docker build --no-cache \
          --build-arg WITH_DEBUG_INFO=true \
          --build-arg ARTIFACTIMAGE=$ARTIFACT_IMAGE \
          "${oci_labels[@]}" \
          -f ${{ inputs.allin1_dockerfile }} \
          -t ghcr.io/celonis/celostar/starrocks-allin1:$IMAGE_TAG \
          -t $ECR_REGISTRY/celostar/starrocks-allin1:$IMAGE_TAG .

        docker push ghcr.io/celonis/celostar/starrocks-allin1:$IMAGE_TAG
        docker push $ECR_REGISTRY/celostar/starrocks-allin1:$IMAGE_TAG
