  build-asan-allin1-image:
    runs-on: [runs-on,runner=32cpu-linux-x64,image=ubuntu22-full-x64,disk=large,"run-id=${{ github.run_id }}"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull dev env image
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${{ github.repository }} --password-stdin
          docker pull ${BUILDER}

      - name: Build ASAN artifact image
        uses: ./.github/actions/build-artifact
        with:
          dev_env_image: ${BUILDER}
          image_tag: ${ASAN_IMAGE_TAG}
          is_asan_mode: 'yes'
          to_push: false

      - name: Build and push ASAN allin1 image
        uses: ./.github/actions/build-allin1
        with:
          artifact_image: starrocks-artifacts:${ASAN_IMAGE_TAG}
          image_tag: ${ASAN_IMAGE_TAG}
          pull_artifact: false
          clean_up_artifact_image: true
