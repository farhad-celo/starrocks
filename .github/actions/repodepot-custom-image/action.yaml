name: Create Image
description: Template action used to produce a image through a custom build process.

# Repo Depot will provide these inputs as part of the overarching workflow.
inputs:
  # The source repository from which a images should be created.
  working-directory:
    description: Relative path under $GITHUB_WORKSPACE to use when running commands.
    required: true
  image-registry:
    description: The name of the container registry to use when creating an image.
    required: true
  image-name:
    description: The name of the image to use when creating a image.
    required: true
  image-tag:
    description: The name of the image tag to use when creating a image.
    required: true
  github-token:
    description: The token to use when accessing Celonis resources.
    required: true
  sca-tag-ref:
    required: true
    default: ''
    description: 'string: Tag to reference for SCA scans'
  srcclr-api-token:
    required: true
    description: 'string: The API token for Sourceclear, typically set in a repository secret called SRCCLR_API_TOKEN'
  secrets:
    description: JSON encoded repository secrets
    required: true
  vars:
    description: JSON encoded repository variables
    required: true
  is-dev-build:
    description: Boolean indicating if the build is a development build
    required: true
  release-branch:
    description: The release branch associated with this release
    required: false
  relative-source-location:
    description: The relative source location of a component (e.g. service, job, library, etc) in the GitHub repository.
    required: false
  component-name:
    description: The name of the component
    required: true

# Repo Depot expects these outputs to be set and to all be 'true' in order to continue
# the overarching workflow.
outputs:
  build-status:
    description: 'Indicates whether the build was successful (type: boolean, values: true/false).'
    value: ${{ steps.build.outputs.status }}
  test-status:
    description: 'Indicates whether the testing was successful (type: boolean, values: true/false).'
    value: ${{ steps.test.outputs.status }}

  # See https://github.com/docker/build-push-action for more information.
  image-metadata:
    description: 'JSON metadata output from the docker image creation'
    value: ${{ steps.create-image.outputs.metadata }}

runs:
  using: composite

  # Delegates image builds to be-native-build.yaml (BE) and fe-native-build.yaml (FE).
  # Requires gh (GitHub CLI) on the runner and a token with actions:write to trigger workflows.
  steps:
    - name: Dispatch be-native-build (celostar-be)
      id: dispatch-be-native-build
      if: inputs.component-name == 'celostar-be' || inputs.component-name == '~ALL~'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKFLOW_FILE: be-native-build.yaml
        GH_REPO: celonis/celostar-starrocks
        WORKFLOW_REF: ${{ github.head_ref || github.ref_name }}
      run: |
        set -euo pipefail
        rel="${{ inputs.relative-source-location }}"
        rel="${rel:-.}"

        gh workflow run "$WORKFLOW_FILE" \
          --repo "$GH_REPO" \
          --ref "${WORKFLOW_REF}" \
          -f component-name="${{ inputs.component-name }}" \
          -f version="${{ inputs.image-tag }}" \
          -f relative-source-location="${rel}" \
          -f release-branch="${WORKFLOW_REF}" \
          -f github-token="${{ inputs.github-token }}" \
          -f image-registry="${{ inputs.image-registry }}" \
          -f image-name="${{ inputs.image-name }}" \
          -f image-tag="${{ inputs.image-tag }}"

        sleep 5

        RUN_ID=$(gh run list --repo "$GH_REPO" --workflow "$WORKFLOW_FILE" --branch "${WORKFLOW_REF}" --limit 1 --json databaseId --jq '.[0].databaseId')

        if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
          echo "::error::Could not find the triggered Run ID. Check if $WORKFLOW_FILE exists on ${WORKFLOW_REF}."
          exit 1
        fi

        gh run watch "$RUN_ID" --repo "$GH_REPO" -i 300 --exit-status

    - name: Dispatch fe-native-build (celostar-fe)
      id: dispatch-fe-native-build
      if: inputs.component-name == 'celostar-fe' || inputs.component-name == '~ALL~' 
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKFLOW_FILE: fe-native-build.yaml
        GH_REPO: celonis/celostar-starrocks
        WORKFLOW_REF: ${{ github.head_ref || github.ref_name }}
      run: |
        set -euo pipefail
        rel="${{ inputs.relative-source-location }}"
        rel="${rel:-.}"

        gh workflow run "$WORKFLOW_FILE" \
          --repo "$GH_REPO" \
          --ref "${WORKFLOW_REF}" \
          -f component-name="${{ inputs.component-name }}" \
          -f version="${{ inputs.image-tag }}" \
          -f relative-source-location="${rel}" \
          -f release-branch="${WORKFLOW_REF}" \
          -f github-token="${{ inputs.github-token }}" \
          -f image-registry="${{ inputs.image-registry }}" \
          -f image-name="${{ inputs.image-name }}" \
          -f image-tag="${{ inputs.image-tag }}"

        sleep 5

        RUN_ID=$(gh run list --repo "$GH_REPO" --workflow "$WORKFLOW_FILE" --branch "${WORKFLOW_REF}" --limit 1 --json databaseId --jq '.[0].databaseId')

        if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
          echo "::error::Could not find the triggered Run ID. Check if $WORKFLOW_FILE exists on ${WORKFLOW_REF}."
          exit 1
        fi

        gh run watch "$RUN_ID" --repo "$GH_REPO" -i 300 --exit-status
