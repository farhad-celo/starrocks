  tags:
    - celostar
  annotations:
    github.com/project-slug: celonis/celostar-starrocks
    argocd/app-selector: app=celostar-starrocks
    sonarqube.org/project-key: celonis_celostar-starrocks-fe
    backstage.io/code-coverage: scm-only
    backstage.io/techdocs-entity: system:celostar
    backstage.io/techdocs-ref: dir:../docs
    repo-depot.celonis.dev/project-type: CUSTOM
    repo-depot.celonis.dev/image-name: celostar/starrocks-fe
    repo-depot.celonis.dev/dply-release-approval-team: Celostar
    repo-depot.celonis.dev/workflow-runner-release: runner=64cpu-linux-arm64,image=ubuntu24-full-arm64,disk=large
    repo-depot.com/release-schedule-cron-time-spec-utc: '30 16 * * 1'
    repo-depot.com/release-manager-opsgenie-schedule-id: 5d6fef26-8404-489f-bd1e-b2b7df6e2ec4
    prr-slo.celonis.dev/alerts_slack_channel: celostar-oncall
