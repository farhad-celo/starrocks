apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: celostar-be
  title: celostar-be
  description: celostar-be is the BackEnd of the query engine behind Celostar. BEs are responsible for data storage and SQL execution.
  tags:
    - celostar
  annotations:
    github.com/project-slug: celonis/celostar-starrocks
    argocd/app-selector: app=celostar-starrocks
    backstage.io/techdocs-ref: dir:/docs
    sonarqube.org/project-key: celonis_celostar-starrocks-be
    backstage.io/code-coverage: scm-only
    backstage.io/techdocs-entity: system:celostar
    prr-slo.celonis.dev/alerts_slack_channel: celostar-oncall
    prr-slo.celonis.dev/opsgenie_handle: Celostar
    secauto.celosec.com/sca-exclude-paths: '["docs/", "test/requirements.txt"]'
  links:
    - title: Celostar JIRA
      url: https://celonis.atlassian.net/jira/software/c/projects/CELOSTAR/boards/925
      icon: dashboard
      type: jira
    - title: "#celostar-support"
      url: https://grid-celonis.enterprise.slack.com/archives/C06P9DZ9FS9
      icon: group
      type: slack-channel
    - title: OpsGenie Oncall group
      url: https://celonis.app.eu.opsgenie.com/teams/dashboard/b86b4448-2e8c-4ad1-a281-9c858e4e1725/main
      icon: chat
      type: opsgenie-team
    - url: https://www.celonis.dev/docs/default/Component/celostar-wiki/runbooks/
      title: Runbook
      icon: dashboard
      type: runbook
spec:
  type: service
  lifecycle: production
  owner: group:default/celostar
  tier: "0"
  system: system:default/celostar
  dependencyOf:
    - component:celostar-gateway
    - component:celostar-fe
