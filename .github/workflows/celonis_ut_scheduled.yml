name: "Celonis Unit Test and SonarQube Daily"

on:
  schedule:
    - cron: "30 5 * * *"
  # To manually trigger the workflow. For debugging purpose.
  workflow_dispatch:

env:
  RELEASE_VERSION: fe-test
  GITHUB_USERNAME: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
  BUILDER: ghcr.io/celonis/celostar/starrocks-dev-env:3.5-cc-86b916f9
  BUILD_PARALLELISM: 16

jobs:
  setup:
    runs-on: [runs-on, runner=1cpu-linux-arm64, "run-id=${{ github.run_id }}"]
    outputs:
      builder_image: ghcr.io/celonis/celostar/starrocks-dev-env:3.5-cc-86b916f9
    steps:
      - run: echo "builder_image=${{ env.BUILDER }}" >> $GITHUB_OUTPUT

  fe-amd-test:
    runs-on: [runs-on, "runner=64cpu-linux-x64,volume=100g", "run-id=${{ github.run_id }}"]
    needs: setup
    container:
      image: ${{ needs.setup.outputs.builder_image }}
      credentials:
        username: ${{ github.repository }}
        password: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: FE unit tests
        uses: ./.github/actions/fe-unit-tests
      - name: Upload FE AMD test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fe-amd-test-diagnostics
          path: |
            fe/fe-core/target/surefire-reports/
            fe/fe-core/*.dump
            fe/fe-core/*-jvmRun*.dump
            fe/fe-core/*.dumpstream
            fe/fe-core/hs_err_pid*.log
            hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 1

  fe-arm-test:
    runs-on: [runs-on, "runner=64cpu-linux-arm64,volume=100g", "run-id=${{ github.run_id }}"]
    needs: setup
    container:
      image: ${{ needs.setup.outputs.builder_image }}
      credentials:
        username: ${{ github.repository }}
        password: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: FE unit tests
        uses: ./.github/actions/fe-unit-tests
      - name: Upload FE ARM test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fe-arm-test-diagnostics
          path: |
            fe/fe-core/target/surefire-reports/
            fe/fe-core/*.dump
            fe/fe-core/*-jvmRun*.dump
            fe/fe-core/*.dumpstream
            fe/fe-core/hs_err_pid*.log
            hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 1

  fe-sonarQube-scan:
    runs-on: [runs-on, "runner=64cpu-linux-x64,volume=100g", "run-id=${{ github.run_id }}"]
    needs: setup
    container:
      image: ${{ needs.setup.outputs.builder_image }}
      credentials:
        username: ${{ github.repository }}
        password: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: FE Build and Test with JaCoCo
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          STARROCKS_HOME: ${{ github.workspace }}
        run: |
          export FE_UT_PARALLEL=6

          cd fe
          mvn clean install -DskipTests

          set +e
          mvn test -DfailIfNoTests=false -DtrimStackTrace=false \
             -Dtest='*,!com.starrocks.sql.dump.QueryDumpRegressionTest,!com.starrocks.sql.dump.QueryDumpCaseRewriter,!com.starrocks.planner.**,!LakePublishBatchTest.testBatchPublishReplicationTransaction,!LakePublishBatchTest.testTransfromSingleToBatch,!com.starrocks.statistic.CancelableAnalyzeTaskTest.shouldHandleConcurrentCancellationAttempts'
          fe_test_status=$?
          set -e

          mvn -pl fe-core org.jacoco:jacoco-maven-plugin:report
          mvn -pl fe-core dependency:copy-dependencies -DincludeScope=compile -Dmdep.prependGroupId=true
          exit "${fe_test_status}"

      - name: Output FE Coverage Summary
        if: always()
        shell: bash
        env:
          STARROCKS_HOME: ${{ github.workspace }}
        run: |
          echo "## FE (Java) Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          JACOCO_XML="${STARROCKS_HOME}/fe/fe-core/target/site/jacoco/jacoco.xml"
          if [ ! -f "$JACOCO_XML" ]; then
            echo "> **Warning:** JaCoCo report not found at \`$JACOCO_XML\`" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          python3 - "$JACOCO_XML" >> $GITHUB_STEP_SUMMARY << 'PYEOF'
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse(sys.argv[1])
          root = tree.getroot()
          counters = {}
          for c in root.findall('counter'):
              counters[c.get('type')] = (int(c.get('missed')), int(c.get('covered')))

          print("| Metric | Covered | Missed | Total | Coverage |")
          print("|--------|--------:|-------:|------:|---------:|")
          for metric in ['INSTRUCTION', 'BRANCH', 'LINE', 'METHOD', 'CLASS']:
              if metric in counters:
                  missed, covered = counters[metric]
                  total = missed + covered
                  pct = (covered / total * 100) if total > 0 else 0
                  icon = ":white_check_mark:" if pct >= 60 else ":warning:" if pct >= 40 else ":x:"
                  print(f"| {icon} {metric.capitalize()} | {covered:,} | {missed:,} | {total:,} | **{pct:.1f}%** |")
          PYEOF

      - name: Upload FE SonarQube artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe-sonar-artifacts
          path: |
            fe/fe-core/target/site/jacoco/jacoco.xml
            fe/fe-core/target/classes/
            fe/fe-core/target/dependency/
          if-no-files-found: error
          retention-days: 1

      - name: SonarQube FE Scan
        if: always() && hashFiles('fe/fe-core/target/site/jacoco/jacoco.xml') != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.projectKey=celonis_celostar-starrocks-fe
            -Dsonar.organization=celonis
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=fe/fe-core/src/main/java
            -Dsonar.inclusions=fe/fe-core/src/main/java/**/*.java
            -Dsonar.java.binaries=fe/fe-core/target/classes
            -Dsonar.java.libraries=fe/fe-core/target/dependency/*.jar
            -Dsonar.coverage.jacoco.xmlReportPaths=fe/fe-core/target/site/jacoco/jacoco.xml

  be-sonarQube-scan:
    name: be-sonarQube-scan
    runs-on: [runs-on, "runner=64cpu-linux-x64,volume=150g", "run-id=${{ github.run_id }}"]
    needs: setup
    env:
      BUILD_PARALLELISM: 32
      BE_TEST_TIMEOUT: 1h
    container:
      image: ${{ needs.setup.outputs.builder_image }}
      credentials:
        username: ${{ github.repository }}
        password: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Python 3.8 for gcovr
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - name: install gcovr 5.0
        run: |
          apt-get update
          apt-get install -y libxml2-dev libxslt1-dev zlib1g-dev gcc python3-dev

          pip install gcovr==5.0 # 5.1 is not supported
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check Container Resources
        run: |
          echo "--- Total RAM available to container ---"
          free -h
          echo "--- Cgroup Memory Limit ---"
          cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || cat /sys/fs/cgroup/memory.max
      - name: Set up envs
        shell: bash
        run: |
          # Define the home directory
          export STARROCKS_HOME=$(pwd)
          export CMAKE_BUILD_TYPE=Release
          export CMAKE_BUILD_DIR=${STARROCKS_HOME}/be/ut_build_${CMAKE_BUILD_TYPE}
          export SONARQUBE_OUTPUT=${STARROCKS_HOME}/sonarqube_output

          echo "STARROCKS_HOME=${STARROCKS_HOME}" >> $GITHUB_ENV
          echo "CMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE}" >> $GITHUB_ENV
          echo "CMAKE_BUILD_DIR=${CMAKE_BUILD_DIR}" >> $GITHUB_ENV
          echo "SONARQUBE_OUTPUT=${SONARQUBE_OUTPUT}" >> $GITHUB_ENV

      - name: Configure and build BE tests
        shell: bash
        run: |
          # Source environment scripts if they exist
          [ -f ./env.sh ] && . ./env.sh

          # Create build and output directories
          cd ${STARROCKS_HOME}/be
          mkdir -p ${CMAKE_BUILD_DIR}
          cd ${CMAKE_BUILD_DIR}
          mkdir -p ${SONARQUBE_OUTPUT}

          # Keep this tunable to balance compile speed and memory use.
          cmake -G "Unix Makefiles" \
                -DCMAKE_BUILD_TYPE=Release \
                -DSTARROCKS_JIT_ENABLE=ON \
                -DWITH_GCOV=ON \
                -DMAKE_TEST=ON \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DCOMPRESS_DEBUG_SECTIONS=OFF \
                -DCMAKE_CXX_FLAGS="-g1 -fdebug-types-section -fPIC" \
                -DCMAKE_C_FLAGS="-g1 -fdebug-types-section -fPIC" \
                -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--compress-debug-sections=none -Wl,--strip-debug" \
                ..
          cp compile_commands.json "${SONARQUBE_OUTPUT}/compile_commands.json"
          make -j"${BUILD_PARALLELISM:-16}" starrocks_test

      - name: Run Tests
        id: run-be-tests
        shell: bash
        run: |
          source ${STARROCKS_HOME}/bin/common.sh
          curdir="${STARROCKS_HOME}/bin"
          export_shared_envvars
          mkdir -p "${UDF_RUNTIME_DIR}" "${LOG_DIR}"

          # Add thirdparty libraries (including jemalloc and TBB) to the library path
          export LD_LIBRARY_PATH=/var/local/thirdparty/installed/jemalloc/lib-shared:/var/local/thirdparty/installed/lib:$LD_LIBRARY_PATH

          jvm_arch="amd64"
          if [ "$JAVA_HOME" = "" ]; then
            echo "[WARNING] JAVA_HOME env not set. Functions or features that requires jni will not work at all."
            export LD_LIBRARY_PATH=$STARROCKS_HOME/lib:$LD_LIBRARY_PATH
          else
            java_version=$(jdk_version)
            if [[ $java_version -gt 8 ]]; then
              export LD_LIBRARY_PATH=$JAVA_HOME/lib/server:$JAVA_HOME/lib:$LD_LIBRARY_PATH
              # JAVA_HOME is jdk
            elif [[ -d "$JAVA_HOME/jre"  ]]; then
              export LD_LIBRARY_PATH=$JAVA_HOME/jre/lib/$jvm_arch/server:$JAVA_HOME/jre/lib/$jvm_arch:$LD_LIBRARY_PATH
            # JAVA_HOME is jre
            else
              export LD_LIBRARY_PATH=$JAVA_HOME/lib/$jvm_arch/server:$JAVA_HOME/lib/$jvm_arch:$LD_LIBRARY_PATH
            fi
          fi

          # Match the BE unit-test launcher classpath setup.
          export LD_LIBRARY_PATH=${STARROCKS_HOME}/lib/hadoop/native:$LD_LIBRARY_PATH
          export LIBHDFS_OPTS="${LIBHDFS_OPTS:-} -Djdk.lang.processReaperUseDefaultStackSize=true -Xrs"
          gtest_filter="*Celonis*:JSONModelCreatorTest*:JSONToModelCreatorTest*:MatchPatternUtilTest*:SerializationUtilsTest*:TbbTest*:TimeRangeTest*"

          hadoop_common_home="${STARROCKS_HOME}/java-extensions/hadoop-lib/target/hadoop-lib"
          if [[ -d "${hadoop_common_home}" ]]; then
            export HADOOP_CLASSPATH="${hadoop_common_home}/*:${hadoop_common_home}/lib/*:"
          fi
          export CLASSPATH="${STARROCKS_HOME}/conf:${HADOOP_CLASSPATH:-}:${STARROCKS_HOME}/java-extensions/udf-extensions/target/*:${STARROCKS_HOME}/java-extensions/java-utils/target/*:${CLASSPATH:-}"

          # Execute tests to generate .gcda coverage data files
          cd ${STARROCKS_HOME}
          echo "GTest filter: ${gtest_filter}"

          test_status=0
          test_timeout="${BE_TEST_TIMEOUT:-1h}"
          set +e
          echo "Run test: ${CMAKE_BUILD_DIR}/test/starrocks_test (timeout: ${test_timeout})"
          timeout --signal=TERM --kill-after=60s "${test_timeout}" \
            "${CMAKE_BUILD_DIR}/test/starrocks_test" --gtest_filter="${gtest_filter}"
          test_status=$?
          set -e

          echo "BE_TEST_STATUS=${test_status}" >> $GITHUB_ENV
          if [ "${test_status}" -ne 0 ]; then
            echo "Some tests failed, proceeding to collect remaining coverage..."
          fi

      - name: Collect coverage into one XML report
        if: always()
        run: |
          cd ${STARROCKS_HOME}
          # -r . : Set the project root
          # --object-directory : Point to where .gcda files are located
          # --filter : Match the BE paths included in the SonarQube scan
          # --sonarqube : Generate Sonar-compatible XML format
          gcda_count=$(find ${CMAKE_BUILD_DIR} -name '*.gcda' | wc -l | tr -d ' ')
          echo "Found ${gcda_count} .gcda files before gcovr."
          if [ "${gcda_count}" -eq 0 ]; then
            echo "::error::No .gcda files were produced. The test process likely aborted before gcov data was flushed."
            exit 1
          fi
          gcovr -r ${STARROCKS_HOME} \
                --object-directory ${CMAKE_BUILD_DIR} \
                --filter 'be/src/exprs/celonis/.*' \
                --exclude 'be/src/exprs/celonis/modules/.*' \
                --sonarqube coverage.xml
      - name: Output BE Coverage Summary
        if: always()
        shell: bash
        run: |
          echo "## BE (C++) Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          COVERAGE_XML="${STARROCKS_HOME}/coverage.xml"
          if [ ! -f "$COVERAGE_XML" ]; then
            echo "> **Warning:** Coverage report not found at \`$COVERAGE_XML\`" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          python3 - "$COVERAGE_XML" >> $GITHUB_STEP_SUMMARY << 'PYEOF'
          import xml.etree.ElementTree as ET, sys

          tree = ET.parse(sys.argv[1])
          root = tree.getroot()

          def is_celonis_path(path):
              normalized = path.replace("\\", "/").lower()
              parts = normalized.split("/")
              filename = parts[-1] if parts else ""
              return "celonis" in parts or "celonis" in filename

          def collect_stats(files):
              stats = {
                  "files": 0,
                  "total_lines": 0,
                  "covered_lines": 0,
                  "total_branches": 0,
                  "covered_branches": 0,
              }
              for f in files:
                  stats["files"] += 1
                  for line in f.findall('lineToCover'):
                      stats["total_lines"] += 1
                      if line.get('covered') == 'true':
                          stats["covered_lines"] += 1
                      branch_total = line.get('branchesToCover')
                      branch_covered = line.get('coveredBranches')
                      if branch_total is not None:
                          stats["total_branches"] += int(branch_total)
                          stats["covered_branches"] += int(branch_covered) if branch_covered else 0
              return stats

          def pct(covered, total):
              return (covered / total * 100) if total > 0 else 0

          def icon(value):
              if value >= 60: return ":white_check_mark:"
              if value >= 40: return ":warning:"
              return ":x:"

          def print_coverage_table(stats):
              line_pct = pct(stats["covered_lines"], stats["total_lines"])
              branch_pct = pct(stats["covered_branches"], stats["total_branches"])

              print("| Metric | Covered | Total | Coverage |")
              print("|--------|--------:|------:|---------:|")
              print(f"| {icon(line_pct)} Lines | {stats['covered_lines']:,} | {stats['total_lines']:,} | **{line_pct:.1f}%** |")
              if stats["total_branches"] > 0:
                  print(f"| {icon(branch_pct)} Branches | {stats['covered_branches']:,} | {stats['total_branches']:,} | **{branch_pct:.1f}%** |")
              print(f"| Files analyzed | {stats['files']:,} | | |")

          files = root.findall('.//file')
          celonis_files = [f for f in files if is_celonis_path(f.get('path', ''))]

          print_coverage_table(collect_stats(files))

          print("")
          print("## Celonis BE (C++) Code Coverage")
          print("")
          if celonis_files:
              print_coverage_table(collect_stats(celonis_files))
          else:
              print("> No Celonis C++ files found in the coverage report.")
          PYEOF

      - name: Verify BE SonarQube inputs
        shell: bash
        run: |
          test -s sonarqube_output/compile_commands.json
          test -s coverage.xml

      - name: SonarQube BE Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.projectKey=celonis_celostar-starrocks-be
            -Dsonar.organization=celonis
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=be/src/exprs/celonis
            -Dsonar.cfamily.compile-commands=sonarqube_output/compile_commands.json
            -Dsonar.coverageReportPaths=coverage.xml
            -Dsonar.exclusions=be/src/exprs/celonis/modules/**

      - name: Upload BE SonarQube artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: be-sonar-artifacts
          path: |
            sonarqube_output/
            coverage.xml
          if-no-files-found: error
          retention-days: 1

      - name: Fail if BE tests failed
        if: always()
        shell: bash
        run: |
          if [ "${BE_TEST_STATUS:-0}" -ne 0 ]; then
            echo "BE unit tests failed with exit code ${BE_TEST_STATUS}"
            exit "${BE_TEST_STATUS}"
          fi
