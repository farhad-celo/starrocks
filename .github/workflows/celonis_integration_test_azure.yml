name: Rebase and Test on Azure
run-name: Rebase and Test - ${{inputs.branch_to_test || 'sync and rebase upstream'}}

on:
  schedule:
    - cron:  '0 7 * * 0,2,4' # Around Pacific time of midnight of Sunday, Tuesday and Thursday
  workflow_dispatch:
    inputs:
      branch_to_test:
        description: "The branch to build images and run tests. If empty, will rebase upstream code and then build images to test"
        default: ''
      image_to_build:
        description: "The image tag to build. Only take effect when above input is not empty. If empty, will construct one from the above input branch name"
        default: ''

env:
  LATEST_UPSTREAM_BRANCH: branch-3.5-cc
  BUILDER: ghcr.io/celonis/celostar/starrocks-dev-env:3.5-cc-86b916f9
  GITHUB_USERNAME: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-and-rebase-upstream:
    runs-on: [runs-on, runner=1cpu-linux-arm64, "run-id=${{ github.run_id }}"]
    outputs:
      test_branch: ${{steps.rebase.outputs.test_branch || inputs.branch_to_test}}
      test_image_tag: ${{ steps.rebase.outputs.test_branch || steps.image_tag_output.outputs.test_image_tag }}
      pr_base_branch: ${{ steps.rebase.outputs.pr_base_branch }}
      synced_celo_branch: ${{ steps.rebase.outputs.synced_celo_branch }}
    steps:
      - name: Output image tag
        if: ${{inputs.branch_to_test != ''}}
        id: image_tag_output
        run: |
          branch=${{inputs.branch_to_test}}
          echo "The branch to test is: ${branch}"
          if [[ -n "${{inputs.image_to_build}}" ]]; then
            image_tag="${{inputs.image_to_build}}_$(date +%Y%m%d%H%M%S)"
            if ! [[ "$image_tag" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "Invalid image tag: must contain only lowercase and uppercase letters, digits, underscores (_), periods (.), and dashes (-)."
              exit 1
            elif [[ "$image_tag" =~ ^[.-] ]]; then
              echo "Invalid image tag: must not start with a period (.) or a dash (-)."
              exit 1
            fi
          else
            image_tag="${branch//\//_}_$(date +%Y%m%d%H%M%S)"
          fi
          echo "The test image tag to build is: ${image_tag}"
          echo "test_image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{inputs.branch_to_test == ''}}
        uses: actions/checkout@v4
        with:
          ref: branch-3.0-c0d5082c-celo
      - name: Remote add upstream
        if: ${{inputs.branch_to_test == ''}}
        run: |
          git remote add upstream https://github.com/starrocks/starrocks.git
        continue-on-error: true
      - name: Fetch upstream and push
        if: ${{inputs.branch_to_test == ''}}
        run: |
          git fetch upstream ${LATEST_UPSTREAM_BRANCH}:${LATEST_UPSTREAM_BRANCH}
          git push origin ${LATEST_UPSTREAM_BRANCH}
      - name: Rebase
        id: rebase
        if: ${{inputs.branch_to_test == ''}}
        run: |
          git config user.email "celostar-starrocks@noreply.github.com"
          git config user.name "celostar-starrocks"
          echo "start to rebase ..."
          git fetch
          git checkout ${LATEST_UPSTREAM_BRANCH}
          latest_commit=$(git rev-parse --short=8 HEAD)
          echo "the latest commit is ${latest_commit}"
          newdefaultbranch=${LATEST_UPSTREAM_BRANCH}-${latest_commit}-celo
          echo "The new default branch is: ${newdefaultbranch}"
          echo "newdefaultbranch=$newdefaultbranch" >> "$GITHUB_ENV"
          if git show-ref --verify --quiet refs/heads/${newdefaultbranch}; then
              echo "branch '${newdefaultbranch}' already exists. Checking out..."
              git checkout ${newdefaultbranch}
          else
              echo "branch '${newdefaultbranch}' does not exist. Creating and checking out and pushing to remote ..."
              git checkout -b ${newdefaultbranch}
              git push --set-upstream origin ${newdefaultbranch}
          fi
          default_branch=${{ github.ref_name }}
          echo "the current default branch is ${default_branch}"
          retries=5
          count=0
          run_rebase() {
            git checkout ${default_branch} && \
            timestamp=$(date +'%Y-%m-%dT%H-%M-%S') && \
            testbranch=gh-${LATEST_UPSTREAM_BRANCH}-${latest_commit}-${timestamp} && \
            git checkout -b $testbranch && \
            git rebase ${newdefaultbranch}
          }
          until [ $count -ge $retries ]
          do
            echo "Attempt $((count+1))"
            run_rebase && break
            count=$((count+1))
            echo "Rebase failed, retrying in 5 seconds..."
            sleep 5
          done
          if [ $count -eq $retries ]; then
            echo "Command failed after $retries attempts"
            exit 1
          fi
          git push --set-upstream origin $testbranch
          echo "test_branch=$testbranch" >> "$GITHUB_ENV"
          echo "test_branch=$testbranch" >> "$GITHUB_OUTPUT"
          echo "pr_base_branch=${default_branch}" >> "$GITHUB_OUTPUT"
          echo "synced_celo_branch=${newdefaultbranch}" >> "$GITHUB_OUTPUT"

      - name: Range-diff (rebase patch series)
        if: ${{ inputs.branch_to_test == '' }}
        shell: bash
        env:
          PR_BASE: ${{ steps.rebase.outputs.pr_base_branch }}
          HEAD_BRANCH: ${{ env.test_branch }}
          NEW_DEFAULT: ${{ env.newdefaultbranch }}
        run: |
          set -euo pipefail
          if [[ -z "${HEAD_BRANCH:-}" || -z "${PR_BASE:-}" || -z "${NEW_DEFAULT:-}" ]]; then
            echo "Skip range-diff: missing PR_BASE, HEAD_BRANCH, or NEW_DEFAULT."
            exit 0
          fi
          git fetch origin "${HEAD_BRANCH}" --quiet 2>/dev/null || true
          git checkout "${HEAD_BRANCH}"
          MB=$(git merge-base "${NEW_DEFAULT}" "${PR_BASE}") || true
          if [[ -z "${MB}" ]]; then
            echo "::warning::Range-diff skipped: no merge-base between ${NEW_DEFAULT} and ${PR_BASE}"
            exit 0
          fi
          RANGE_DIFF_OUT=$(git range-diff "${MB}..${PR_BASE}" "${NEW_DEFAULT}..HEAD" 2>&1) || true
          if echo "${RANGE_DIFF_OUT}" | grep -q '[^[:space:]]'; then
            echo "::error title=Range-diff mismatch::Patch series differs after rebase (onto ${NEW_DEFAULT}). See job summary for full output."
            echo -e "\033[31m[Range-diff] differences detected (onto ${NEW_DEFAULT})\033[0m" >&2
            {
              echo "### 🔴 **Range-diff: patch series differs** (onto \`${NEW_DEFAULT}\`)"
              echo ""
              echo '```text'
              echo "${RANGE_DIFF_OUT}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo -e "\033[32m[Range-diff] no differences reported (onto ${NEW_DEFAULT})\033[0m" >&2
            {
              echo "### ✅ Range-diff: no differences (onto \`${NEW_DEFAULT}\`)"
              echo ""
              echo "_`git range-diff` produced no output — patch series matches._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sum up
        if: ${{inputs.branch_to_test == ''}}
        shell: bash
        run: |
          {
            echo "The new default branch is ${{env.newdefaultbranch}}"
            echo "The test branch is ${{env.test_branch}}"
          } >> $GITHUB_STEP_SUMMARY

  presubmit-test:
    runs-on: [runs-on,runner=64cpu-linux-x64, image=ubuntu22-full-x64, disk=large, "run-id=${{ github.run_id }}"]
    if: inputs.branch_to_test == ''
    needs: sync-and-rebase-upstream
    env:
      test_branch: ${{needs.sync-and-rebase-upstream.outputs.test_branch}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{env.test_branch}}
      - name: Pull dev env image
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${GITHUB_USERNAME} --password-stdin
          docker pull ${{ env.BUILDER }}
      - name: Test
        uses: ./.github/actions/presubmit-test
        with:
          builder: ${{ env.BUILDER }}

  build-arm:
    needs: sync-and-rebase-upstream
    uses: ./.github/workflows/celonis_reusable_build_arch.yml
    secrets: inherit
    with:
      variant: release
      runs_on_json: '["runs-on","runner=64cpu-linux-arm64","image=ubuntu24-full-arm64","disk=large","run-id=${{ github.run_id }}"]'
      test_branch: ${{ needs.sync-and-rebase-upstream.outputs.test_branch }}
      image_tag: ${{ needs.sync-and-rebase-upstream.outputs.test_image_tag }}-arm
      test_image_tag: ${{ needs.sync-and-rebase-upstream.outputs.test_image_tag }}
      builder_image: ghcr.io/celonis/celostar/starrocks-dev-env:3.5-cc-86b916f9

  build-x86:
    needs: sync-and-rebase-upstream
    uses: ./.github/workflows/celonis_reusable_build_arch.yml
    secrets: inherit
    with:
      variant: release
      runs_on_json: '["runs-on","runner=64cpu-linux-x64","image=ubuntu24-full-x64","disk=large","run-id=${{ github.run_id }}"]'
      test_branch: ${{ needs.sync-and-rebase-upstream.outputs.test_branch }}
      image_tag: ${{ needs.sync-and-rebase-upstream.outputs.test_image_tag }}-x86
      test_image_tag: ${{ needs.sync-and-rebase-upstream.outputs.test_image_tag }}
      builder_image: ghcr.io/celonis/celostar/starrocks-dev-env:3.5-cc-86b916f9

  build-manifest:
    runs-on: [runs-on, runner=1cpu-linux-arm64, "run-id=${{ github.run_id }}"]
    needs: [build-arm, build-x86]
    env:
      test_branch: ${{ needs.build-x86.outputs.test_branch }}
      arm_image_tag: ${{ needs.build-arm.outputs.allin1_image }}
      x86_image_tag: ${{ needs.build-x86.outputs.allin1_image }}
      allin1_image_tag: ${{ needs.build-x86.outputs.test_image_tag }}
      fe_be_image_tag: ${{ needs.build-x86.outputs.test_image_tag }}
    outputs:
      test_branch: ${{ needs.build-x86.outputs.test_branch }}
      allin1_image_tag: ${{ env.allin1_image_tag }}
      fe_be_image_tag: ${{ env.fe_be_image_tag }}
    steps:
      - name: GHCR login
        shell: bash
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${GITHUB_USERNAME} --password-stdin
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.test_branch }}
      - name: Build and push allin1 manifest
        uses: ./.github/actions/build-mul-arch-manifest
        with:
          arm_image_tag: ghcr.io/celonis/celostar/starrocks-allin1:${{ env.arm_image_tag }}
          x86_image_tag: ghcr.io/celonis/celostar/starrocks-allin1:${{ env.x86_image_tag }}
          mul_arch_image_tag: ghcr.io/celonis/celostar/starrocks-allin1:${{ env.allin1_image_tag }}
      - name: Build and push starrocks-be manifest (GHCR)
        uses: ./.github/actions/build-mul-arch-manifest
        with:
          arm_image_tag: ghcr.io/celonis/celostar/starrocks-be:${{ env.arm_image_tag }}
          x86_image_tag: ghcr.io/celonis/celostar/starrocks-be:${{ env.x86_image_tag }}
          mul_arch_image_tag: ghcr.io/celonis/celostar/starrocks-be:${{ env.fe_be_image_tag }}
      - name: Build and push starrocks-fe manifest (GHCR)
        uses: ./.github/actions/build-mul-arch-manifest
        with:
          arm_image_tag: ghcr.io/celonis/celostar/starrocks-fe:${{ env.arm_image_tag }}
          x86_image_tag: ghcr.io/celonis/celostar/starrocks-fe:${{ env.x86_image_tag }}
          mul_arch_image_tag: ghcr.io/celonis/celostar/starrocks-fe:${{ env.fe_be_image_tag }}
      - name: Configure prod AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      - name: prod Amazon ECR login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push fe-be manifest to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: ./.github/actions/build-mul-arch-manifest
        with:
          arm_image_tag: ${{ env.ECR_REGISTRY }}/celostar/starrocks-be:${{ env.arm_image_tag }}
          x86_image_tag: ${{ env.ECR_REGISTRY }}/celostar/starrocks-be:${{ env.x86_image_tag }}
          mul_arch_image_tag: ${{ env.ECR_REGISTRY }}/celostar/starrocks-be:${{ env.fe_be_image_tag }}
      - name: Build and push fe manifest to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: ./.github/actions/build-mul-arch-manifest
        with:
          arm_image_tag: ${{ env.ECR_REGISTRY }}/celostar/starrocks-fe:${{ env.arm_image_tag }}
          x86_image_tag: ${{ env.ECR_REGISTRY }}/celostar/starrocks-fe:${{ env.x86_image_tag }}
          mul_arch_image_tag: ${{ env.ECR_REGISTRY }}/celostar/starrocks-fe:${{ env.fe_be_image_tag }}

  celostar-presubmit-test:
    runs-on: [runs-on, runner=1cpu-linux-arm64, "run-id=${{ github.run_id }}"]
    needs: build-manifest
    outputs:
      workflow_url: ${{ steps.run-test.outputs.workflow_url }}
    env:
      test_image_tag: ${{needs.build-manifest.outputs.allin1_image_tag}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run celostar presubmit test
        id: run-test
        uses: ./.github/actions/trigger-celostar-test
        with:
          owner: celonis
          repo: celostar
          workflow_file: "presubmit-test.yml"
          payload: '{\"event_type\":\"trigger_presubmit_test\",\"client_payload\":{\"image_tag\":\"${test_image_tag}\"}}'
      - name: Summarize the result
        if: always() && steps.run-test.outcome != 'skipped'
        run: |
          {
            echo "The presubmit test workflow is: ${{steps.run-test.outputs.workflow_url}}"
          } >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  e2e-tests:
    runs-on: [runs-on,runner=1cpu-linux-x64, image=ubuntu22-full-x64, "run-id=${{ github.run_id }}"]
    needs: build-manifest
    outputs:
      workflow_url: ${{ steps.run-test.outputs.workflow_url }}
    env:
      test_image_tag: ${{ needs.build-manifest.outputs.fe_be_image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run celostar e2e test
        id: run-test
        uses: ./.github/actions/trigger-celostar-test
        with:
          owner: celonis
          repo: celostar
          workflow_file: "e2e-test-suite-azure-v2.yml"
          payload: >
            { 
              \"event_type\":\"trigger_e2e_test_suite_on_azure_v2\",
              \"client_payload\": {
                \"e2e_job_name\":\"${test_image_tag}\",
                \"starrocks_image_tag\":\"${test_image_tag}\",
                \"gateway_image_tag\":\"branch\"}
            }
      - name: Summarize the result
        if: always() && steps.run-test.outcome != 'skipped'
        run: |
          {
            echo "The E2E test workflow is: ${{steps.run-test.outputs.workflow_url}}"
          } >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  create-rebase-pr:
    runs-on: [runs-on, runner=1cpu-linux-x64, image=ubuntu22-full-x64, "run-id=${{ github.run_id }}"]
    # Create the PR as soon as the sync/rebase succeeds so its checks can start immediately.
    if: ${{ needs.sync-and-rebase-upstream.result == 'success' && (github.event_name == 'schedule' || inputs.branch_to_test == '') }}
    needs: sync-and-rebase-upstream
    outputs:
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
    steps:
      - name: Create pull request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ needs.sync-and-rebase-upstream.outputs.test_branch }}
          BASE_BRANCH: ${{ needs.sync-and-rebase-upstream.outputs.pr_base_branch }}
          SYNCED_CELO: ${{ needs.sync-and-rebase-upstream.outputs.synced_celo_branch }}
        run: |
          set -euo pipefail
          if [[ -z "${HEAD_BRANCH}" || -z "${BASE_BRANCH}" ]]; then
            echo "Skipping PR: missing head or base (manual image-only run or incomplete sync outputs)."
            exit 0
          fi
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/${REPO}/pulls"
          TITLE="Integration rebase: ${HEAD_BRANCH} → ${SYNCED_CELO}"
          BODY_FILE=$(mktemp)
          {
            echo "Automated PR created after the **sync-and-rebase-upstream** job completed successfully."
            echo ""
            echo "- **Head (rebased test branch):** \`${HEAD_BRANCH}\`"
            echo "- **Base:** \`${BASE_BRANCH}\`"
            echo "- **Upstream-aligned celo branch:** \`${SYNCED_CELO}\`"
            echo "- **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$BODY_FILE"
          BODY_JSON=$(jq -Rs . < "$BODY_FILE")
          rm -f "$BODY_FILE"
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg head "$HEAD_BRANCH" \
            --arg base "$SYNCED_CELO" \
            --argjson body "$BODY_JSON" \
            '{title: $title, head: $head, base: $base, body: $body}')
          HTTP=$(curl -sS -o /tmp/pr_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$PAYLOAD" \
            "$API") || true
          if [[ "$HTTP" == "201" ]]; then
            PR_URL=$(jq -r '.html_url // empty' /tmp/pr_resp.json)
            PR_NUMBER=$(jq -r '.number // empty' /tmp/pr_resp.json)
            echo "Created PR: ${PR_URL}"
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          elif [[ "$HTTP" == "422" ]]; then
            echo "PR not created (422 — branch may already have an open PR or not be ahead of base). Response:"
            cat /tmp/pr_resp.json
            exit 0
          else
            echo "Failed to create PR (HTTP ${HTTP}):"
            cat /tmp/pr_resp.json
            exit 1
          fi
      - name: PR link summary
        if: success() && steps.create_pr.outputs.pr_url != ''
        run: |
          echo "Created rebase PR: ${{ steps.create_pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"

  build-asan-arm:
    needs: sync-and-rebase-upstream
    uses: ./.github/workflows/celonis_reusable_build_arch.yml
    secrets: inherit
    with:
      variant: asan
      runs_on_json: '["runs-on","runner=64cpu-linux-arm64","image=ubuntu24-full-arm64","disk=large","run-id=${{ github.run_id }}"]'
      test_branch: ${{ needs.sync-and-rebase-upstream.outputs.test_branch }}
      image_tag: ${{ needs.sync-and-rebase-upstream.outputs.test_image_tag }}-asan-arm
      test_image_tag: ${{ needs.sync-and-rebase-upstream.outputs.test_image_tag }}
      builder_image: ghcr.io/celonis/celostar/starrocks-dev-env:3.5-cc-86b916f9

  build-asan-x86:
    needs: sync-and-rebase-upstream
    uses: ./.github/workflows/celonis_reusable_build_arch.yml
    secrets: inherit
    with:
      variant: asan
      runs_on_json: '["runs-on","runner=64cpu-linux-x64","image=ubuntu24-full-x64","disk=large","run-id=${{ github.run_id }}"]'
      test_branch: ${{ needs.sync-and-rebase-upstream.outputs.test_branch }}
      image_tag: ${{ needs.sync-and-rebase-upstream.outputs.test_image_tag }}-asan-x86
      test_image_tag: ${{ needs.sync-and-rebase-upstream.outputs.test_image_tag }}
      builder_image: ghcr.io/celonis/celostar/starrocks-dev-env:3.5-cc-86b916f9

  build-asan-manifest:
    runs-on: [ runs-on, runner=1cpu-linux-arm64, "run-id=${{ github.run_id }}" ]
    needs: [ build-asan-arm, build-asan-x86 ]
    env:
      test_branch: ${{ needs.build-asan-x86.outputs.test_branch }}
      arm_image_tag: ${{ needs.build-asan-arm.outputs.allin1_image }}
      x86_image_tag: ${{ needs.build-asan-x86.outputs.allin1_image }}
      allin1_image_tag: ${{ needs.build-asan-x86.outputs.test_image_tag }}-asan
    outputs:
      test_branch: ${{ needs.build-asan-x86.outputs.test_branch }}
      allin1_image_tag: ${{ env.allin1_image_tag }}
    steps:
      - name: GHCR login
        shell: bash
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${{ github.repository }} --password-stdin
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.test_branch }}
      - name: Build and push allin1 manifest
        uses: ./.github/actions/build-mul-arch-manifest
        with:
          arm_image_tag: "ghcr.io/celonis/celostar/starrocks-allin1:${{ env.arm_image_tag }}"
          x86_image_tag: "ghcr.io/celonis/celostar/starrocks-allin1:${{ env.x86_image_tag }}"
          mul_arch_image_tag: "ghcr.io/celonis/celostar/starrocks-allin1:${{ env.allin1_image_tag }}"

  celostar-compliance-test:
    runs-on: [runs-on, runner=1cpu-linux-arm64, "run-id=${{ github.run_id }}"]
    needs: build-manifest
    outputs:
      workflow_url: ${{ steps.run-test.outputs.workflow_url }}
    env:
      test_image_tag: ${{ needs.build-manifest.outputs.allin1_image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run celostar compliance test
        id: run-test
        continue-on-error: true
        uses: ./.github/actions/trigger-celostar-test
        with:
          owner: celonis
          repo: celostar
          workflow_file: "compliance-test.yml"
          payload: '{\"event_type\":\"trigger_compliance_test\",\"client_payload\":{\"image_tag\":\"${test_image_tag}\"}}'
      - name: Summarize the result
        if: always() && steps.run-test.outcome != 'skipped'
        run: |
          {
            echo "The compliance test workflow is: ${{steps.run-test.outputs.workflow_url}}"
          } >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  post-test-urls-to-pr:
    runs-on: [runs-on, runner=1cpu-linux-arm64, "run-id=${{ github.run_id }}"]
    if: ${{ always() && needs.create-rebase-pr.result == 'success' && needs.create-rebase-pr.outputs.pr_number != '' }}
    needs:
      - create-rebase-pr
      - celostar-presubmit-test
      - e2e-tests
      - celostar-compliance-test
    steps:
      - name: Post test workflow URLs to pull request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.create-rebase-pr.outputs.pr_number }}
          PRESUBMIT_URL: ${{ needs.celostar-presubmit-test.outputs.workflow_url }}
          E2E_URL: ${{ needs.e2e-tests.outputs.workflow_url }}
          COMPLIANCE_URL: ${{ needs.celostar-compliance-test.outputs.workflow_url }}
        with:
          github-token: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
          script: |
            const tests = [
              ['Celostar presubmit test', process.env.PRESUBMIT_URL],
              ['Celostar E2E test', process.env.E2E_URL],
              ['Celostar compliance test', process.env.COMPLIANCE_URL],
            ];
            const lines = ['## Celostar test runs', ''];
            for (const [name, url] of tests) {
              lines.push(url ? `- [${name}](${url})` : `- ${name}: workflow URL unavailable`);
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: lines.join('\n'),
            });
