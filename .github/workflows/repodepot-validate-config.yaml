name: '[RepoDepot] Validate Config'
run-name: '[RepoDepot] Validate Config: ${{ github.ref_name }}'

# Triggered when .github/repodepot-config.yaml changes in a pull request.
# Validates the config against the Repo Depot schema before it is merged and
# baked into the delivered workflows on the next re-enrollment.
# Do not edit this file by hand — changes will be overwritten on the next enrollment.
on:
  pull_request:
    paths:
      - '.github/repodepot-config.yaml'

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Config
    uses: celonis/repo-depot/.github/workflows/reusable-validate-repodepot-config.yaml@stable
    with:
      repo-depot-version: stable
      repository-name: celonis/celostar-starrocks
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
