name: 'celostar-starrocks release'

# **What it does**: Renders the content of every page and check all internal links.
# **Why we have it**: To make sure all links connect correctly.
# **Who does it impact**: Docs content.

on:
  release:
    types: [published]

permissions:
  contents: read
  # Needed for the 'trilom/file-changes-action' action
  pull-requests: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  RELEASE_VERSION: ${{ github.ref_name }}
  GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

jobs:
  release-ubuntu-image:
    runs-on: [self-hosted, celostar]
    env:
      BUILDER: ghcr.io/celonis/celostar/starrocks-dev-env:3.1-54a4553b
    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: GitHub Docker login
        run: |
          echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${{ github.repository }} --password-stdin
      - name: Pull dev env image
        run: |
          docker pull ${BUILDER}
      - name: build artifact docker image
        run: |
          # Build image and always remove intermediate containers.
          DOCKER_BUILDKIT=1 docker build --force-rm=true --build-arg RELEASE_VERSION=${RELEASE_VERSION} --build-arg builder=${BUILDER} -f celonis/docker/artifact/artifact.Dockerfile -t starrocks-artifacts:${RELEASE_VERSION}-ubuntu .

      - name: package allin1 docker image
        run: |
          # Build image and always remove intermediate containers.
          DOCKER_BUILDKIT=1 docker build --force-rm=true --build-arg ARTIFACTIMAGE=starrocks-artifacts:${RELEASE_VERSION}-ubuntu -f celonis/docker/allin1/allin1-ubuntu.Dockerfile -t starrocks-allin1:${RELEASE_VERSION}-ubuntu celonis/docker/allin1

      - name: package fe docker image
        run: |
          # Build image and always remove intermediate containers.
          DOCKER_BUILDKIT=1 docker build --force-rm=true --build-arg ARTIFACTIMAGE=starrocks-artifacts:${RELEASE_VERSION}-ubuntu -f docker/dockerfiles/fe/fe-ubuntu.Dockerfile -t starrocks-fe:${RELEASE_VERSION}-ubuntu .

      - name: package be docker image
        run: |
          # Build image and always remove intermediate containers.
          DOCKER_BUILDKIT=1 docker build --force-rm=true --build-arg ARTIFACTIMAGE=starrocks-artifacts:${RELEASE_VERSION}-ubuntu -f docker/dockerfiles/be/be-ubuntu.Dockerfile -t starrocks-be:${RELEASE_VERSION}-ubuntu .


      - name: push allin1 docker image to GHCR
        run: |
          docker tag starrocks-allin1:${RELEASE_VERSION}-ubuntu ghcr.io/celonis/celostar/starrocks-allin1:${RELEASE_VERSION}-ubuntu
          
          # Pushing to the GitHub packages docker registry regularly fails with "unknown blob" errors. The "fix" suggested by GitHub is looping.
          until docker push ghcr.io/celonis/celostar/starrocks-allin1:${RELEASE_VERSION}-ubuntu
          do
            echo "Could not push ghcr.io/celonis/celostar/starrocks-allin1:${RELEASE_VERSION}-ubuntu trying again."
          done
      - name: push fe docker image to GHCR
        run: |
          docker tag starrocks-fe:${RELEASE_VERSION}-ubuntu ghcr.io/celonis/celostar/starrocks-fe:${RELEASE_VERSION}-ubuntu
          
          # Pushing to the GitHub packages docker registry regularly fails with "unknown blob" errors. The "fix" suggested by GitHub is looping.
          until docker push ghcr.io/celonis/celostar/starrocks-fe:${RELEASE_VERSION}-ubuntu
          do
            echo "Could not push ghcr.io/celonis/celostar/starrocks-fe:${RELEASE_VERSION}-ubuntu trying again."
          done
      - name: push be docker image to GHCR
        run: |
          docker tag starrocks-be:${RELEASE_VERSION}-ubuntu ghcr.io/celonis/celostar/starrocks-be:${RELEASE_VERSION}-ubuntu

          # Pushing to the GitHub packages docker registry regularly fails with "unknown blob" errors. The "fix" suggested by GitHub is looping.
          until docker push ghcr.io/celonis/celostar/starrocks-be:${RELEASE_VERSION}-ubuntu
          do
            echo "Could not push ghcr.io/celonis/celostar/starrocks-be:${RELEASE_VERSION}-ubuntu trying again."
          done

      - name: GitHub Docker logout
        if: ${{ always() }}
        run: |
          docker logout ghcr.io

      - name: Configure prod AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: prod Amazon ECR login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: push allin1 docker image to prod ECR
        run: |
          # push to the prod ECR
          docker tag starrocks-allin1:${RELEASE_VERSION}-ubuntu 652406827250.dkr.ecr.eu-central-1.amazonaws.com/celostar/starrocks-allin1:${RELEASE_VERSION}-ubuntu
          docker push 652406827250.dkr.ecr.eu-central-1.amazonaws.com/celostar/starrocks-allin1:${RELEASE_VERSION}-ubuntu
      - name: push fe docker image to prod ECR
        run: |
          # push to the prod ECR
          docker tag starrocks-fe:${RELEASE_VERSION}-ubuntu 652406827250.dkr.ecr.eu-central-1.amazonaws.com/celostar/starrocks-fe:${RELEASE_VERSION}-ubuntu
          docker push 652406827250.dkr.ecr.eu-central-1.amazonaws.com/celostar/starrocks-fe:${RELEASE_VERSION}-ubuntu
      - name: push be docker image to prod ECR
        run: |
          # push to the prod ECR
          docker tag starrocks-be:${RELEASE_VERSION}-ubuntu 652406827250.dkr.ecr.eu-central-1.amazonaws.com/celostar/starrocks-be:${RELEASE_VERSION}-ubuntu
          docker push 652406827250.dkr.ecr.eu-central-1.amazonaws.com/celostar/starrocks-be:${RELEASE_VERSION}-ubuntu

      - name: Clean up and Amazon ECR logout
        if: ${{ always() }}
        run: |
          docker logout ${{ steps.login-ecr.outputs.registry }}
          
          # Delete the built docker image from the runner.
          docker rmi -f $(docker images -q starrocks-allin1:${RELEASE_VERSION}-ubuntu)
          docker rmi -f $(docker images -q starrocks-fe:${RELEASE_VERSION}-ubuntu)
          docker rmi -f $(docker images -q starrocks-be:${RELEASE_VERSION}-ubuntu)
          docker rmi -f $(docker images -q starrocks-artifacts:${RELEASE_VERSION}-ubuntu)
          
          # Delete stopped containers, dangling images, dangling build cache, etc.
          docker system prune -f
          
          # We could not simply delete the repo as it will fail the "Post checkout repository" step from the checkout action
          # after this step.
          rm -rf /runner/_work/celostar-starrocks/celostar-starrocks/*

          # Remove temporary files.
          rm -rf /tmp/*
        continue-on-error: true
