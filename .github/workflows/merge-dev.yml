name: Auto Cherry-pick from branch-3.3-f2255f48-celo to celostar-3.5.6-dev

on:
  push:
    branches: [branch-3.3-f2255f48-celo]
  # Configuring a workflow to run manually
  workflow_dispatch:

concurrency:
  group: merge-dev-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_BRANCH: branch-3.3-f2255f48-celo
  TARGET_BRANCH: celostar-3.5.6-dev
  Builder: ghcr.io/celonis/celostar/starrocks-dev-env:3.5.6-2e5f7565

jobs:
  merge-to-target:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto cherry-pick new commits from source branch
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "celostar-starrocks@noreply.github.com"
          git checkout ${{ env.TARGET_BRANCH }}
          
          # Get the list of new commits from source branch after the specific commit
          # Only pick commits that were added after 34235ec963bbd5efe9fdd246d5fe876362fe9a52
          SOURCE_COMMITS=$(git rev-list --reverse 34235ec963bbd5efe9fdd246d5fe876362fe9a52..origin/${{ env.SOURCE_BRANCH }})
          echo "Source commits after 34235ec963bbd5efe9fdd246d5fe876362fe9a52: $SOURCE_COMMITS"
          
          if [ -z "$SOURCE_COMMITS" ]; then
            echo "No new commits in source branch. Target branch is up to date."
            exit 0
          fi
          
          # Filter out commits that already exist in target branch
          NEW_COMMITS=""
          for COMMIT in $SOURCE_COMMITS; do
            # Check if this commit already exists in target branch
            if git merge-base --is-ancestor $COMMIT HEAD; then
              echo "Commit $COMMIT already exists in target branch, skipping..."
            else
              echo "Commit $COMMIT is new and needs to be cherry-picked"
              NEW_COMMITS="$NEW_COMMITS $COMMIT"
            fi
          done
          
          if [ -z "$NEW_COMMITS" ]; then
            echo "All source commits already exist in target branch. No cherry-pick needed."
            exit 0
          fi
          
          echo "New commits to cherry-pick: $NEW_COMMITS"
          
          # Initialize tracking variables
          SUCCESSFUL_COMMITS=""
          FAILED_COMMITS=""
          PARTIAL_SUCCESS=false
          
          # Cherry-pick each new commit in order
          for COMMIT in $NEW_COMMITS; do
            echo "Cherry-picking commit $COMMIT to target branch..."
            if git cherry-pick $COMMIT; then
              echo "Successfully cherry-picked commit $COMMIT"
              SUCCESSFUL_COMMITS="$SUCCESSFUL_COMMITS $COMMIT"
            else
              echo "Cherry-pick failed for commit $COMMIT"
              FAILED_COMMITS="$FAILED_COMMITS $COMMIT"
              
              # Abort the failed cherry-pick
              git cherry-pick --abort
              PARTIAL_SUCCESS=true
              
              # Continue with remaining commits
              echo "Continuing with remaining commits..."
            fi
          done
          
          # Set environment variables for subsequent steps
          echo "SUCCESSFUL_COMMITS=$SUCCESSFUL_COMMITS" >> $GITHUB_ENV
          echo "FAILED_COMMITS=$FAILED_COMMITS" >> $GITHUB_ENV
          echo "PARTIAL_SUCCESS=$PARTIAL_SUCCESS" >> $GITHUB_ENV
          
          # If we have successful commits, create a branch and push
          if [ -n "$SUCCESSFUL_COMMITS" ]; then
            BRANCH_NAME="cherry-pick-$(date +%Y%m%d-%H%M%S)-${{ github.run_id }}"
            echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
            
            git checkout -b $BRANCH_NAME
            echo "Created branch $BRANCH_NAME with successful cherry-picks"
          fi

      - name: Install GitHub CLI
        if: env.SUCCESSFUL_COMMITS != ''
        shell: bash
        run: |
          # Install GitHub CLI
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Create PR for successful cherry-picks
        if: env.SUCCESSFUL_COMMITS != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
        run: |
          if [ "${{ env.PARTIAL_SUCCESS }}" = "true" ]; then
            # Push the branch with successful commits
            git push origin ${{ env.BRANCH_NAME }}
            
            # Create detailed PR body
            PR_TITLE="Partial Cherry-pick: $(echo ${{ env.SUCCESSFUL_COMMITS }} | wc -w) commits from ${{ env.SOURCE_BRANCH }}"
            
            # Create PR body file
            cat > pr_body.md << 'PRBODY'
          ## Cherry-pick Summary
          
          This PR contains successfully cherry-picked commits from `${{ env.SOURCE_BRANCH }}` to `${{ env.TARGET_BRANCH }}`.
          
          ### ✅ Successfully Cherry-picked Commits:
          PRBODY
            
            # Add successful commits details
            for COMMIT in ${{ env.SUCCESSFUL_COMMITS }}; do
              COMMIT_MESSAGE=$(git log --format=%s -n 1 $COMMIT)
              COMMIT_AUTHOR=$(git log --format="%an" -n 1 $COMMIT)
              echo "- \`$COMMIT\` - $COMMIT_MESSAGE (by $COMMIT_AUTHOR)" >> pr_body.md
            done
            
            echo "" >> pr_body.md
            echo "### ❌ Failed Commits:" >> pr_body.md
            echo "" >> pr_body.md
            
            # Add failed commits details
            for COMMIT in ${{ env.FAILED_COMMITS }}; do
              COMMIT_MESSAGE=$(git log --format=%s -n 1 $COMMIT)
              COMMIT_AUTHOR=$(git log --format="%an" -n 1 $COMMIT)
              echo "- \`$COMMIT\` - $COMMIT_MESSAGE (by $COMMIT_AUTHOR)" >> pr_body.md
            done
            
            cat >> pr_body.md << 'PRBODY'
          
          ### Next Steps:
          - Review the successful cherry-picks
          - Manual intervention required for failed commits
          - Failed commits may need to be cherry-picked manually or conflicts resolved
          PRBODY
            
            # Create PR
            gh pr create \
              --title "$PR_TITLE" \
              --body-file pr_body.md \
              --base ${{ env.TARGET_BRANCH }} \
              --head ${{ env.BRANCH_NAME }}
            
            # Get PR number and construct URL
            PR_NUMBER=$(gh pr list --head ${{ env.BRANCH_NAME }} --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
              PR_URL="https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
              echo "Created PR for partial success: $PR_TITLE"
              echo "🔗 PR URL: $PR_URL"
              echo "PR_URL=$PR_URL" >> $GITHUB_ENV
            else
              echo "Created PR for partial success: $PR_TITLE"
              echo "⚠️ Could not retrieve PR number, but PR was created successfully"
              echo "You can find the PR at: https://github.com/${{ github.repository }}/pulls"
            fi
          else
            echo "All cherry-picks successful, no PR needed"
          fi

      - name: Push merged target branch
        if: env.PARTIAL_SUCCESS != 'true'
        shell: bash
        run: |
          echo "Pushing changes to ${{ env.TARGET_BRANCH }}..."
          if git push origin ${{ env.TARGET_BRANCH }}; then
            echo "Successfully pushed changes to ${{ env.TARGET_BRANCH }}"
          else
            echo "Failed to push changes to ${{ env.TARGET_BRANCH }}"
            exit 1
          fi

      - name: Generate GitHub Action Summary
        if: always()
        shell: bash
        run: |
          echo "# Cherry-pick Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ env.SUCCESSFUL_COMMITS }}" != "" ]; then
            echo "## ✅ Successfully Cherry-picked Commits" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for COMMIT in ${{ env.SUCCESSFUL_COMMITS }}; do
              COMMIT_MESSAGE=$(git log --format=%s -n 1 $COMMIT)
              COMMIT_AUTHOR=$(git log --format="%an" -n 1 $COMMIT)
              echo "- \`$COMMIT\` - $COMMIT_MESSAGE (by $COMMIT_AUTHOR)" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ env.FAILED_COMMITS }}" != "" ]; then
            echo "## ❌ Failed Cherry-picks" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following commits failed to cherry-pick and require manual intervention:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for COMMIT in ${{ env.FAILED_COMMITS }}; do
              COMMIT_MESSAGE=$(git log --format=%s -n 1 $COMMIT)
              COMMIT_AUTHOR=$(git log --format="%an" -n 1 $COMMIT)
              echo "- \`$COMMIT\` - $COMMIT_MESSAGE (by $COMMIT_AUTHOR)" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Recommended Actions:" >> $GITHUB_STEP_SUMMARY
            echo "1. Review the failed commits manually" >> $GITHUB_STEP_SUMMARY
            echo "2. Resolve any conflicts" >> $GITHUB_STEP_SUMMARY
            echo "3. Cherry-pick the remaining commits manually" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ env.PARTIAL_SUCCESS }}" = "true" ]; then
            echo "## 📋 Partial Success" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "A PR has been created with the successfully cherry-picked commits." >> $GITHUB_STEP_SUMMARY
            if [ "${{ env.PR_URL }}" != "" ]; then
              echo "🔗 **PR Link**: ${{ env.PR_URL }}" >> $GITHUB_STEP_SUMMARY
            fi
            echo "Please review and merge the PR, then manually handle the failed commits." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ env.SUCCESSFUL_COMMITS }}" != "" ] && [ "${{ env.FAILED_COMMITS }}" = "" ]; then
            echo "## ✅ Complete Success" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All commits were successfully cherry-picked and pushed to \`${{ env.TARGET_BRANCH }}\`." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
