name: Publish Celostar multi-arch image manifests
description: >-
  Creates and pushes manifest lists for starrocks-be, starrocks-fe (ECR + GHCR)
  and starrocks-allin1 (GHCR) from per-arch tags.

inputs:
  tag_arm:
    description: Image tag for the arm64 single-arch image (tag only, not full ref).
    required: true
  tag_x86:
    description: Image tag for the amd64 single-arch image.
    required: true
  tag_combined:
    description: Multi-arch manifest tag (allin1 + FE + BE use this on GHCR; FE/BE on ECR).
    required: true
  celostar_docker_tag:
    description: >-
      The extra Celostar format tag (e.g. pr<pr-number>-<version>) to push.
      Leave empty to skip publishing a Celostar alias.
      Generated upstream (repodepot-custom-image) and passed through the native build workflows.
    required: false
    default: ''
  publish_be:
    description: Publish starrocks-be multi-arch manifests (ECR + GHCR).
    required: false
    default: 'true'
  publish_fe:
    description: Publish starrocks-fe multi-arch manifests (ECR + GHCR).
    required: false
    default: 'true'
  publish_allin1:
    description: Publish starrocks-allin1 multi-arch manifest (GHCR).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: GHCR login
      shell: bash
      run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_USERNAME}" --password-stdin

    - name: Authenticate to AWS (OIDC)
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: arn:aws:iam::652406827250:role/github-actions-org-oidc
        aws-region: eu-central-1

    - name: Amazon ECR login
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: GHCR — starrocks-allin1 manifest
      if: ${{ inputs.publish_allin1 == 'true' }}
      shell: bash
      env:
        ARM_IMAGE_TAG: ghcr.io/celonis/celostar/starrocks-allin1:${{ inputs.tag_arm }}
        X86_IMAGE_TAG: ghcr.io/celonis/celostar/starrocks-allin1:${{ inputs.tag_x86 }}
        MULTI_ARCH_IMAGE_TAG: ghcr.io/celonis/celostar/starrocks-allin1:${{ inputs.tag_combined }}
        OCI_VERSION: ${{ inputs.celostar_docker_tag }}
      run: |
        set -euo pipefail
        annotations=(
          --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}"
        )
        if [[ -n "${OCI_VERSION}" ]]; then
          annotations+=(
            --annotation "index:org.opencontainers.image.version=${OCI_VERSION}"
            --annotation "manifest-descriptor[linux/arm64]:org.opencontainers.image.version=${OCI_VERSION}-arm"
            --annotation "manifest-descriptor[linux/amd64]:org.opencontainers.image.version=${OCI_VERSION}-amd"
          )
        fi

        docker buildx imagetools create \
          "${annotations[@]}" \
          --tag "${MULTI_ARCH_IMAGE_TAG}" \
          "${ARM_IMAGE_TAG}" \
          "${X86_IMAGE_TAG}"

    - name: GHCR — starrocks-allin1 Celostar manifest
      if: ${{ inputs.publish_allin1 == 'true' && inputs.celostar_docker_tag != '' }}
      shell: bash
      env:
        ARM_IMAGE_TAG: ghcr.io/celonis/celostar/starrocks-allin1:${{ inputs.tag_arm }}
        X86_IMAGE_TAG: ghcr.io/celonis/celostar/starrocks-allin1:${{ inputs.tag_x86 }}
        MULTI_ARCH_IMAGE_TAG: ghcr.io/celonis/celostar/starrocks-allin1:${{ inputs.celostar_docker_tag }}
        OCI_VERSION: ${{ inputs.celostar_docker_tag }}
      run: |
        set -euo pipefail
        annotations=(
          --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}"
          --annotation "index:org.opencontainers.image.version=${OCI_VERSION}"
          --annotation "manifest-descriptor[linux/arm64]:org.opencontainers.image.version=${OCI_VERSION}-arm"
          --annotation "manifest-descriptor[linux/amd64]:org.opencontainers.image.version=${OCI_VERSION}-amd"
        )

        docker buildx imagetools create \
          "${annotations[@]}" \
          --tag "${MULTI_ARCH_IMAGE_TAG}" \
          "${ARM_IMAGE_TAG}" \
          "${X86_IMAGE_TAG}"

    - name: ECR + GHCR — starrocks-be + starrocks-fe manifests
      if: ${{ inputs.publish_be == 'true' || inputs.publish_fe == 'true' }}
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        TAG_ARM: ${{ inputs.tag_arm }}
        TAG_X86: ${{ inputs.tag_x86 }}
        TAG_MULTI: ${{ inputs.tag_combined }}
        PUBLISH_BE: ${{ inputs.publish_be }}
        PUBLISH_FE: ${{ inputs.publish_fe }}
        CELOSTAR_DOCKER_TAG: ${{ inputs.celostar_docker_tag }}
      run: |
        set -euo pipefail
        export DOCKER_CLI_EXPERIMENTAL=enabled
        echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_USERNAME}" --password-stdin

        images=()
        if [[ "${PUBLISH_BE}" == "true" ]]; then
          images+=(starrocks-be)
        fi
        if [[ "${PUBLISH_FE}" == "true" ]]; then
          images+=(starrocks-fe)
        fi

        # Registry prefixes (the "<registry>/<image>" part, minus the tag).
        registries=(
          "${ECR_REGISTRY}/celostar"
          "ghcr.io/celonis/celostar"
        )

        if [[ -n "${CELOSTAR_DOCKER_TAG}" ]]; then
          echo "Celostar Docker tag: ${CELOSTAR_DOCKER_TAG}"
        fi

        annotations=(
          --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}"
        )
        if [[ -n "${CELOSTAR_DOCKER_TAG}" ]]; then
          annotations+=(
            --annotation "index:org.opencontainers.image.version=${CELOSTAR_DOCKER_TAG}"
            --annotation "manifest-descriptor[linux/arm64]:org.opencontainers.image.version=${CELOSTAR_DOCKER_TAG}-arm"
            --annotation "manifest-descriptor[linux/amd64]:org.opencontainers.image.version=${CELOSTAR_DOCKER_TAG}-amd"
          )
        fi

        for registry in "${registries[@]}"; do
          for image in "${images[@]}"; do
            mul_arch_tag="${registry}/${image}:${TAG_MULTI}"
            arm_tag="${registry}/${image}:${TAG_ARM}"
            x86_tag="${registry}/${image}:${TAG_X86}"
            docker buildx imagetools create \
              "${annotations[@]}" \
              --tag "$mul_arch_tag" \
              "$arm_tag" \
              "$x86_tag"
          done
        done
