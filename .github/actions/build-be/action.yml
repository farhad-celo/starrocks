name: Build and push BE image

inputs:
  artifact_image:
    required: true
  image_tag:
    required: true
  branch:
    required: false
  oci_version:
    description: OCI version metadata for the single-architecture image.
    required: false
    default: ''
  to_push:
    required: false
    default: 'true'
    description: "whether to push the images to remote"
  be_dockerfile:
    required: false
    default: 'docker/dockerfiles/be/be-ubuntu.Dockerfile'
    description: "path to BE Dockerfile"

runs:
  using: composite
  steps:
    - name: Docker login to GHCR
      shell: bash
      run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_USERNAME}" --password-stdin

    - name: Authenticate to AWS (OIDC)
      if: ${{ inputs.to_push == 'true' }}
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: arn:aws:iam::652406827250:role/github-actions-org-oidc
        aws-region: eu-central-1

    - name: Login to Amazon ECR
      if: ${{ inputs.to_push == 'true' }}
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push BE image
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        OCI_VERSION: ${{ inputs.oci_version }}
      run: |
        # Registry exports can fail transiently, for example when GHCR returns "unknown blob".
        build_and_push_with_retry() {
          local max_attempts=5
          local delay_seconds=5
          local attempt
          local -a cache_options=(--no-cache)

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if docker buildx build "${cache_options[@]}" \
              --build-arg RUN_AS_USER=starrocks \
              --build-arg ARTIFACTIMAGE="$ARTIFACT_IMAGE" \
              "${oci_labels[@]}" \
              "${oci_annotations[@]}" \
              -f "${{ inputs.be_dockerfile }}" \
              -t "ghcr.io/celonis/celostar/starrocks-be:${IMAGE_TAG}" \
              -t "${ECR_REGISTRY}/celostar/starrocks-be:${IMAGE_TAG}" \
              --provenance=false \
              --push .; then
              return 0
            fi

            if ((attempt == max_attempts)); then
              echo "::error::Failed to build and push BE image after ${max_attempts} attempts"
              return 1
            fi

            echo "Build and push attempt ${attempt}/${max_attempts} failed; retrying in ${delay_seconds}s"
            sleep "${delay_seconds}"
            delay_seconds=$((delay_seconds * 2))
            # Reuse the successful build layers if only the registry export failed.
            cache_options=()
          done
        }

        IMAGE_TAG=${{ inputs.image_tag }}
        ARTIFACT_IMAGE=${{ inputs.artifact_image }}

        oci_labels=(
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
        )
        oci_annotations=(
          --annotation "manifest:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --annotation "manifest:org.opencontainers.image.revision=${GITHUB_SHA}"
        )
        if [[ -n "${OCI_VERSION}" ]]; then
          oci_labels+=(--label "org.opencontainers.image.version=${OCI_VERSION}")
          oci_annotations+=(--annotation "manifest:org.opencontainers.image.version=${OCI_VERSION}")
        fi

        if [ -n "${{ inputs.branch }}" ]; then
          echo "Switching to branch ${{ inputs.branch }}"
          git checkout ${{ inputs.branch }}
        fi

        build_and_push_with_retry
